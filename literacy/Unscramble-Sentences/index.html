<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Unscramble Sentences</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

html,body{

width:100%;
height:100%;
overflow:hidden;
font-family:'Baloo 2',cursive;

}

/*----------------BACKGROUND----------------*/

body{

background:
linear-gradient(
180deg,
#6ED4FF 0%,
#AEE8FF 38%,
#D8F8FF 60%,
#C9F59B 82%,
#9DDD61 100%
);

position:relative;

overflow:hidden;

}

body::before{

content:"";

position:absolute;

inset:0;

pointer-events:none;

background:

radial-gradient(circle at 12% 15%,rgba(255,255,255,.95) 0 65px,transparent 66px),

radial-gradient(circle at 18% 13%,rgba(255,255,255,.95) 0 45px,transparent 46px),

radial-gradient(circle at 24% 15%,rgba(255,255,255,.95) 0 60px,transparent 61px),

radial-gradient(circle at 80% 12%,rgba(255,255,255,.95) 0 75px,transparent 76px),

radial-gradient(circle at 88% 15%,rgba(255,255,255,.95) 0 55px,transparent 56px);

}

/*----------------SCREENS----------------*/

.screen{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:2vh 2vw;

}

.hidden{

display:none;

}

/*----------------LOGO----------------*/

#logoScreen{

background:linear-gradient(180deg,#FFF9DF,#EAF8FF);

}

#logo{

width:min(70vw,320px);

animation:logoPop 1.5s infinite alternate;

}

@keyframes logoPop{

from{

transform:scale(.95);

}

to{

transform:scale(1.03);

}

}

/*----------------TITLE SCREEN----------------*/

#startScreen{

background:

linear-gradient(180deg,#FFFDEB,#E9F8FF,#F2FFE5);

}

.gameTitle{

font-size:clamp(42px,7vw,72px);

font-weight:800;

text-align:center;

line-height:1.05;

letter-spacing:2px;

background:linear-gradient(
90deg,
#FF6B35,
#FFB703,
#43C463,
#5B6CFF,
#FF5DA2
);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

text-shadow:
4px 4px 0 rgba(255,255,255,.95);

margin-bottom:28px;

}


#startBtn{

border:none;

outline:none;

cursor:pointer;

font-family:inherit;

font-weight:700;

font-size:clamp(22px,4vw,32px);

padding:18px 50px;

border-radius:60px;

background:#FFB703;

color:white;

box-shadow:0 10px 18px rgba(0,0,0,.18);

animation:pulse 1.3s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}

/*----------------GAME SCREEN----------------*/

#gameScreen{

justify-content:flex-start;

padding:1.2vh 2vw;

}

.topBar{

width:100%;

display:flex;

justify-content:center;

align-items:center;

position:relative;

margin-bottom:1vh;

}

.title{

font-size:clamp(34px,5vw,60px);

font-weight:800;

letter-spacing:1px;

background:linear-gradient(
90deg,
#FF6B35,
#FFB703,
#5CCB5F,
#6A5AE0,
#FF5DA2
);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

text-shadow:
3px 3px 0px rgba(255,255,255,.9);

}

.speaker{

position:absolute;

right:0;

width:58px;

height:58px;

border:none;

border-radius:50%;

background:white;

font-size:30px;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,.18);

}

.questionBox{

width:min(96vw,1000px);

background:white;

border:4px solid #5DADE2;

border-radius:22px;

padding:12px 18px;

font-size:clamp(19px,2.7vw,30px);

text-align:center;

font-weight:700;

line-height:1.3;

margin-bottom:2vh;

}
/*----------------GAME LAYOUT----------------*/

.gameArea{

width:min(1000px,98vw);

flex:1;

display:flex;

flex-direction:column;

justify-content:space-evenly;

align-items:center;

}

.pictureBoard{

width:100%;

display:flex;

align-items:center;

justify-content:center;

gap:18px;

}

.pictureBox{

width:24%;

height:200px;

background:white;

border:6px solid #6BCB77;

border-radius:28px;

display:flex;

justify-content:center;

align-items:center;

box-shadow:
0 8px 18px rgba(0,0,0,.18);

padding:12px;

}

.pictureBox img{

max-width:100%;

max-height:170px;

object-fit:contain;

}

.answerBoard{

flex:1;

height:190px;

background:linear-gradient(
180deg,
#FFE96B,
#FFD54A
);

border:6px solid #F7B500;

border-radius:32px;

box-shadow:
0 8px 18px rgba(0,0,0,.18),
inset 0 0 0 4px #FFF3A6;

display:flex;

justify-content:center;

align-items:center;

gap:16px;

padding:18px;

overflow:hidden;

}

.slot{

width:115px;

height:72px;

background:#FFFDF5;

border:3px dashed #FF5FA2;

border-radius:18px;

display:flex;

justify-content:center;

align-items:center;

transition:.25s;

box-shadow:
inset 0 2px 8px rgba(0,0,0,.08);

}

.slot.correct{

border:4px solid #39C64A;

background:#F4FFF1;

box-shadow:

0 0 20px rgba(57,198,74,.7),

0 0 35px rgba(57,198,74,.4);

}

.cards{

width:100%;

display:flex;

justify-content:center;

align-items:center;

gap:12px;

flex-wrap:wrap;

padding:8px;

}

.card{

width:110px;

height:70px;

cursor:grab;

transition:.25s;

touch-action:none;

}

.card img{

width:100%;

height:100%;

object-fit:contain;

pointer-events:none;

}

.card.correct{

transform:scale(1.05);

filter:drop-shadow(0 0 8px #41C95E);

}

 .card.selected{

transform:scale(1.08);

border:4px solid #FFD93D;

border-radius:14px;

box-shadow:0 0 18px #FFD93D;

}
 
.shake{

animation:shake .35s;

}

@keyframes shake{

0%{transform:translateX(0);}

20%{transform:translateX(-6px);}

40%{transform:translateX(6px);}

60%{transform:translateX(-6px);}

80%{transform:translateX(6px);}

100%{transform:translateX(0);}

}

/*----------------GOOD JOB----------------*/

#goodJob{

position:absolute;

left:50%;

top:45%;

transform:translate(-50%,-50%) scale(.6);

font-size:clamp(42px,7vw,72px);

font-weight:800;

letter-spacing:2px;

background:linear-gradient(
90deg,
#FF6B35,
#FFD93D,
#52C41A,
#4D96FF,
#FF5DA2
);

-webkit-background-clip:text;
background-clip:text;

color:transparent;

text-shadow:
3px 3px 0 rgba(255,255,255,.9);

opacity:0;

pointer-events:none;

z-index:999;

}

#goodJob.show{

animation:goodjob .9s forwards;

}

@keyframes goodjob{

0%{

opacity:0;

transform:translate(-50%,-50%) scale(.4);

}

40%{

opacity:1;

transform:translate(-50%,-50%) scale(1.2);

}

70%{

opacity:1;

transform:translate(-50%,-50%) scale(1);

}

100%{

opacity:0;

transform:translate(-50%,-50%) scale(1);

}

}

/*----------------PLAY AGAIN----------------*/

#finishScreen{

background:linear-gradient(180deg,#FFFCE8,#EAFBFF,#F0FFE6);

}

#finishTitle{

font-size:clamp(42px,7vw,72px);

font-weight:800;

animation:titleFlash 1s infinite alternate;

margin-bottom:30px;

}

#playAgain{

padding:18px 48px;

border:none;

border-radius:60px;

background:#43AA8B;

color:#fff;

font-family:inherit;

font-size:clamp(22px,4vw,32px);

font-weight:700;

cursor:pointer;

animation:pulse 1.4s infinite;

}

/*----------------RESPONSIVE----------------*/

@media(max-width:900px){

.pictureBoard{

flex-direction:column;

gap:10px;

}

.pictureBox{

width:42%;

height:135px;

}

.pictureBox img{

max-height:120px;

}

.answerBoard{

width:100%;

height:120px;

}

.slot{

width:72px;

height:52px;

}

.card{

width:72px;

height:52px;

}

.speaker{

width:48px;

height:48px;

font-size:24px;

}

}

@media(max-width:480px){

.questionBox{

font-size:17px;

padding:10px;

}

.answerBoard{

height:95px;

padding:8px;

gap:6px;

}

.slot{

width:60px;

height:42px;

}

.card{

width:60px;

height:42px;

}

.pictureBox{

width:46%;

height:110px;

}

.pictureBox img{

max-height:95px;

}

}

</style>

</head>

<body>

<div id="logoScreen" class="screen">

<img
id="logo"
src="assets/innovine-logo.png"
alt="Innovine Logo">

</div>

<div id="startScreen" class="screen hidden">

<h1 class="gameTitle">

Unscramble<br>Sentences

</h1>

<button id="startBtn">

Tap to Start

</button>

</div>

<div id="gameScreen" class="screen hidden">

<div class="topBar">

<h1 class="title">

Unscramble Sentences

</h1>

<button
class="speaker"
id="speakBtn">

🔊

</button>

</div>

<div
class="questionBox"
id="question">

Arrange the word cards to form the correct sentence by dragging and dropping them into the given box.

</div>

<div class="gameArea">

<div class="pictureBoard">

<div class="pictureBox">

<img
id="picture"
src="">

</div>

<div
class="answerBoard"
id="answerBoard">

</div>

</div>

<div
class="cards"
id="cards">

</div>

</div>

</div>

<div id="goodJob">

🌟 Good Job! 🌟

</div>

<div
id="finishScreen"
class="screen hidden">

<h1 id="finishTitle">

Awesome!

</h1>

<button id="playAgain">

Play Again

</button>

</div>

<audio
id="clap"
src="assets/clap.mp3"
preload="auto">

</audio>

<audio
id="wrong"
src="assets/wrong.mp3"
preload="auto">

</audio>

<script>
 /*=========================================================
UNSCRAMBLE SENTENCES
PART 1B.1
=========================================================*/

const QUESTION =
"Tap the word cards in the correct order to make the sentence.";

const rounds = [

{
image:"assets/doctorimage.png",

words:[
"she",
"is",
"a",
"doctor"
],

answer:[
"she",
"is",
"a",
"doctor"
]

},

{
image:"assets/henimage.png",

words:[
"is",
"a",
"hen",
"this"
],

answer:[
"this",
"is",
"a",
"hen"
]

},

{
image:"assets/foximage.png",

words:[
"is",
"this",
"a",
"fox"
],

answer:[
"this",
"is",
"a",
"fox"
]

},

{
image:"assets/catimage.png",

words:[
"i",
"a",
"have",
"cat"
],

answer:[
"i",
"have",
"a",
"cat"
]

},

{
image:"assets/monkeybanana.png",

words:[
"monkey",
"a",
"has",
"this",
"banana"
],

answer:[
"this",
"monkey",
"has",
"a",
"banana"
]

},

{
image:"assets/elephantimage.png",

words:[
"is",
"an",
"elephant",
"this"
],

answer:[
"this",
"is",
"an",
"elephant"
]

},

{
image:"assets/treeimage.png",

words:[
"is",
"the",
"tall",
"tree"
],

answer:[
"the",
"tree",
"is",
"tall"
]

}
,
{
image:"assets/houseimage.png",

words:[
"is",
"a",
"house",
"that"
],

answer:[
"that",
"is",
"a",
"house"
]

},

{
image:"assets/flowerimage.png",

words:[
"these",
"are",
"flowers"
],

answer:[
"these",
"are",
"flowers"
]

},

{
image:"assets/carimage.png",

words:[
"is",
"a",
"car",
"this",
"red"
],

answer:[
"this",
"is",
"a",
"red",
"car"
]

}

];
            
const logoScreen=document.getElementById("logoScreen");
const startScreen=document.getElementById("startScreen");
const gameScreen=document.getElementById("gameScreen");
const finishScreen=document.getElementById("finishScreen");

const picture=document.getElementById("picture");
const cards=document.getElementById("cards");
const answerBoard=document.getElementById("answerBoard");
const question=document.getElementById("question");

const clap=document.getElementById("clap");
const wrong=document.getElementById("wrong");

const goodJob=document.getElementById("goodJob");

const speakBtn=document.getElementById("speakBtn");
const startBtn=document.getElementById("startBtn");
const playAgain=document.getElementById("playAgain");

let round=0;

let placed=[];

let selectedCard=null;

/*======================================================
LOGO SCREEN
======================================================*/

window.onload=()=>{

setTimeout(()=>{

logoScreen.classList.add("hidden");

startScreen.classList.remove("hidden");

},5000);

};

/*======================================================
START GAME
======================================================*/

startBtn.onclick=()=>{

startScreen.classList.add("hidden");

gameScreen.classList.remove("hidden");

loadRound();

};

/*======================================================
VOICE
======================================================*/

function speak(text){

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);

msg.rate=.85;

msg.pitch=1;

speechSynthesis.speak(msg);

}

speakBtn.onclick=()=>{

speak(question.innerText);

};

/*======================================================
LOAD ROUND
======================================================*/

function loadRound(){

placed=[];

selectedCard=null; 

cards.innerHTML="";

answerBoard.innerHTML="";

question.innerHTML=QUESTION;

const current=rounds[round];

picture.src=current.image;

speak(QUESTION);

let shuffled=[...current.words];

shuffle(shuffled);

/*-----------------------------------
Create answer slots
-----------------------------------*/

for(let i=0;i<current.answer.length;i++){

const slot=document.createElement("div");

slot.className="slot";

slot.dataset.index=i;

answerBoard.appendChild(slot);

}

/*-----------------------------------
Create cards
-----------------------------------*/

shuffled.forEach(word=>{

const card=document.createElement("div");

card.className="card";

card.dataset.word=word;

card.innerHTML=`<img src="assets/${word}.png" draggable="false">`;

card.addEventListener("click",selectCard);

cards.appendChild(card);
 

});

}

function selectCard(){

document.querySelectorAll(".card").forEach(card=>{

card.classList.remove("selected");

});

selectedCard=this;

this.classList.add("selected");

// Automatically place the card
placeCard();

}

 /*======================================================
SHUFFLE
======================================================*/

function shuffle(arr){

for(let i=arr.length-1;i>0;i--){

const j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=[arr[j],arr[i]];

}

}

/*======================================================
PLACE CARD
======================================================*/

function placeCard(){

if(!selectedCard) return;

const current=rounds[round];

// Find the next empty position
const index=placed.length;

const expected=current.answer[index];

const selected=selectedCard.dataset.word;

/*---------------CORRECT----------------*/

if(selected===expected){

const slot=document.querySelectorAll(".slot")[index];

slot.appendChild(selectedCard);

slot.classList.add("correct");

selectedCard.classList.add("correct");

selectedCard.classList.remove("selected");

placed.push(selected);

selectedCard=null;

checkComplete();

}

/*---------------WRONG----------------*/

else{

wrong.currentTime=0;

wrong.play();

selectedCard.classList.add("shake");

setTimeout(()=>{

selectedCard.classList.remove("shake");

},350);

}

}

/*======================================================
CHECK COMPLETE
======================================================*/

function checkComplete(){

const current=rounds[round];

if(placed.length!==current.answer.length)return;

for(let i=0;i<current.answer.length;i++){

if(placed[i]!==current.answer[i]){

return;

}

}

finishRound();

}

/*======================================================
FINISH ROUND
======================================================*/

function finishRound(){

speechSynthesis.cancel();

clap.currentTime=0;

clap.play();

goodJob.classList.add("show");

setTimeout(()=>{

goodJob.classList.remove("show");

nextRound();

},1000);

}

/*======================================================
NEXT ROUND
======================================================*/

function nextRound(){

round++;

if(round>=rounds.length){

finishGame();

return;

}

loadRound();

}

/*======================================================
FINISH GAME
======================================================*/

function finishGame(){

speechSynthesis.cancel();

gameScreen.classList.add("hidden");

finishScreen.classList.remove("hidden");

setTimeout(()=>{
    launchConfetti();
},100);

}

/*======================================================
PLAY AGAIN
======================================================*/

playAgain.onclick=()=>{

speechSynthesis.cancel();

round=0;

placed=[];

finishScreen.classList.add("hidden");

gameScreen.classList.add("hidden");

startScreen.classList.add("hidden");

logoScreen.classList.remove("hidden");

setTimeout(()=>{

logoScreen.classList.add("hidden");

startScreen.classList.remove("hidden");

},5000);

};

/*======================================================
CONFETTI
======================================================*/

const confettiCanvas=document.createElement("canvas");

confettiCanvas.id="confetti";

confettiCanvas.style.position="fixed";
confettiCanvas.style.left="0";
confettiCanvas.style.top="0";
confettiCanvas.style.width="100vw";
confettiCanvas.style.height="100vh";
confettiCanvas.style.pointerEvents="none";
confettiCanvas.style.zIndex="999";

document.body.appendChild(confettiCanvas);

const ctx=confettiCanvas.getContext("2d");

let pieces=[];

function resizeCanvas(){

confettiCanvas.width=window.innerWidth;

confettiCanvas.height=window.innerHeight;

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();

function launchConfetti(){

pieces=[];

for(let i=0;i<180;i++){

pieces.push({

x:Math.random()*confettiCanvas.width,

y:-Math.random()*confettiCanvas.height,

r:4+Math.random()*8,

vy:2+Math.random()*5,

vx:-2+Math.random()*4,

rot:Math.random()*360,

vr:-4+Math.random()*8,

color:[
"#FF6B6B",
"#FFD93D",
"#6BCB77",
"#4D96FF",
"#FF8FAB",
"#845EF7"
][Math.floor(Math.random()*6)]

});

}

animateConfetti();

}

function animateConfetti(){

ctx.clearRect(0,0,confettiCanvas.width,confettiCanvas.height);

pieces.forEach(p=>{

ctx.save();

ctx.translate(p.x,p.y);

ctx.rotate(p.rot*Math.PI/180);

ctx.fillStyle=p.color;

ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);

ctx.restore();

p.x+=p.vx;

p.y+=p.vy;

p.rot+=p.vr;

});

pieces=pieces.filter(p=>p.y<confettiCanvas.height+20);

if(pieces.length){

requestAnimationFrame(animateConfetti);

}

}
</script>

</body>

</html>

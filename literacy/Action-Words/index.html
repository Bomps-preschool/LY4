<!DOCTYPE html>
<html lang="en">

<head>
    
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Action Word</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{

width:100%;
height:100%;
overflow:hidden;

font-family:
"Trebuchet MS",
Verdana,
sans-serif;

background:
linear-gradient(
180deg,
#FFF7D6,
#DFF6FF,
#FDE2FF);

}

body{

display:flex;
justify-content:center;
align-items:center;

}

/**********************
MAIN GAME
**********************/

#game{

position:relative;

width:100vw;

height:100vh;

overflow:hidden;

background:

linear-gradient(
180deg,
#FFF7C8 0%,
#CFF6FF 45%,
#FFE1F3 100%);

}

/**********************
COMMON SCREEN
**********************/

.screen{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:18px;

transition:.5s;

}

.hidden{

display:none;

}

/**********************
SPLASH SCREEN
**********************/

#splash{

background:

linear-gradient(
180deg,
#FFFCEB,
#E8F8FF);

}

#logo{

width:min(72vw,320px);

max-width:320px;

animation:

zoomLogo 2s ease infinite alternate;

}

@keyframes zoomLogo{

from{

transform:scale(1);

}

to{

transform:scale(1.06);

}

}

/**********************
TITLE SCREEN
**********************/

#titleScreen{

background:

linear-gradient(
180deg,
#FFF8D9,
#E7F8FF,
#FFEAFE);

}

.gameTitle{

font-size:

clamp(30px,
5vw,
52px);

font-weight:bold;

text-align:center;

line-height:1.35;

padding-top:15px;

margin-bottom:35px;

animation:

flashTitle 1.2s infinite;

text-shadow:

2px 2px white;

}
    
.word1{

color:#FF6B6B;

}

.word2{

color:#2D9CDB;

}

@keyframes flashTitle{

0%{

transform:scale(1);

}

50%{

transform:scale(1.06);

}

100%{

transform:scale(1);

}

}

#startBtn{

padding:

18px 42px;

font-size:

clamp(24px,
3vw,
34px);

font-weight:bold;

border:none;

border-radius:50px;

background:#FFB703;

color:white;

cursor:pointer;

box-shadow:

0 8px 16px rgba(0,0,0,.18);

animation:

pulse 1.2s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}
/**********************
GAME SCREEN
**********************/

#gameScreen{

justify-content:flex-start;

padding:

55px
16px
18px;

background:

linear-gradient(
180deg,

#FFF6B3 0%,

#BDEFFF 30%,

#E5FFD8 60%,

#FFD6EC 100%);
    
}

/**********************
HEADER
**********************/

.header{

width:100%;

text-align:center;

margin-bottom:10px;

}

.header h1{

font-size:clamp(24px,4vw,42px);

font-weight:bold;

line-height:1.3;

padding-top:10px;

margin-bottom:10px;

text-shadow:2px 2px white;

}

.header h1 span:nth-child(1){

color:#FF6B6B;

}

.header h1 span:nth-child(2){

color:#2D9CDB;

}

.instructions{

font-size:

clamp(18px,2.4vw,28px);

font-weight:bold;

color:#5D4A3A;

line-height:1.4;

margin-bottom:10px;

}

/**********************
QUESTION AREA
**********************/

.questionArea{

width:100%;

display:flex;

align-items:center;

justify-content:center;
    

gap:12px;

margin-bottom:16px;

}

.questionBoard{

flex:1;

min-height:78px;

display:flex;

align-items:center;

justify-content:center;

padding:15px;

background:white;

border-radius:22px;

border:5px solid #FFD166;

box-shadow:

0 6px 15px rgba(0,0,0,.12);

font-size:

clamp(24px,3vw,36px);

font-weight:bold;

color:#4D3A2D;

text-align:center;

}

/**********************
SPEAKER BUTTON
**********************/

#speaker{

width:68px;

height:68px;

border:none;

border-radius:50%;

background:#7ED957;

font-size:32px;

cursor:pointer;

box-shadow:

0 5px 12px rgba(0,0,0,.15);

transition:.25s;

}

#speaker:hover{

transform:scale(1.08);

}

#speaker:active{

transform:scale(.95);

}

/**********************
OPTIONS
**********************/

.options{

flex:1;

width:100%;

display:flex;

justify-content:center;

align-items:center;

gap:24px;

}

.card{

width:min(40vw,260px);

height:min(40vw,260px);

max-width:260px;

max-height:260px;

background:#ffffff;
background-image:

linear-gradient(
180deg,
#ffffff,
#FFF7F0);

border-radius:35px;

border:8px solid white;

box-shadow:

0 16px 30px rgba(0,0,0,.20);

display:flex;

justify-content:center;

align-items:center;

cursor:pointer;

transition:.25s;

overflow:hidden;

}

.card:hover{

transform:translateY(-4px);

}

.card img{

width:92%;

height:92%;

object-fit:contain;

pointer-events:none;

user-select:none;

}

/**********************
CORRECT ANSWER
**********************/

.correct{

border-color:#39B54A;

box-shadow:

0 0 20px #39B54A,

0 0 45px rgba(57,181,74,.45);

}

/**********************
WRONG ANSWER
**********************/

.wrong{

animation:shake .35s;

}

@keyframes shake{

0%{transform:translateX(0);}
20%{transform:translateX(-7px);}
40%{transform:translateX(7px);}
60%{transform:translateX(-7px);}
80%{transform:translateX(7px);}
100%{transform:translateX(0);}

}

/**********************
GOOD JOB
**********************/

#message{

position:absolute;

left:50%;

top:52%;

transform:

translate(-50%,-50%);

font-size:

clamp(42px,6vw,72px);

font-weight:bold;

color:#FF5A5F;

text-shadow:

3px 3px white;

display:none;

z-index:30;

animation:

pop .8s;

}

@keyframes pop{

0%{

transform:

translate(-50%,-50%)
scale(.2);

opacity:0;

}

100%{

transform:

translate(-50%,-50%)
scale(1);

opacity:1;

}

}
/**********************
END SCREEN
**********************/

#endScreen{

background:

linear-gradient(
180deg,
#FFF8D8,
#EAFBFF,
#FFE8F8);

justify-content:center;

display:none;

}

#endScreen h2{

font-size:

clamp(40px,6vw,70px);

font-weight:bold;

text-align:center;

line-height:1.3;

margin-bottom:25px;

color:#FF6B6B;

text-shadow:
3px 3px #ffffff;

animation:
flashEnd 1.2s infinite;

}

@keyframes flashEnd{

0%{

transform:scale(1);

}

50%{

transform:scale(1.06);

}

100%{

transform:scale(1);

}

}

#playAgain{

padding:

18px 45px;

font-size:

clamp(24px,3vw,34px);

font-weight:bold;

border:none;

border-radius:50px;

cursor:pointer;

background:#4CAF50;

color:white;

box-shadow:

0 8px 16px rgba(0,0,0,.18);

animation:

pulse 1.2s infinite;

}

/**********************
CONFETTI
**********************/

#confetti{

position:absolute;

inset:0;

pointer-events:none;

overflow:hidden;

z-index:50;

}

.confetti{

position:absolute;

width:14px;

height:26px;

border-radius:3px;

animation:

fall 4s linear forwards;

}

@keyframes fall{

0%{

transform:
translateY(-40px)
rotate(0deg);

opacity:1;

}

100%{

transform:
translateY(900px)
rotate(1440deg);

opacity:0;

}

}

/**********************
RESPONSIVE
**********************/

@media (max-width:700px){

.questionBoard{

font-size:26px;

min-height:72px;

padding:12px;

}

.options{

gap:14px;

}

.card{

width:42vw;

height:42vw;

border-radius:20px;

}

#speaker{

width:60px;

height:60px;

font-size:28px;

}

.instructions{

font-size:20px;

}

}

@media (max-height:700px){

.header h1{

font-size:34px;

}

.instructions{

font-size:18px;

margin-bottom:6px;

}

.questionArea{

margin-bottom:10px;

}

.questionBoard{

min-height:62px;

font-size:24px;

}

.card{

width:34vh;

height:34vh;

}

}

@media (max-width:420px){

#game{

border-radius:0;

width:100vw;

height:100vh;

}

.header h1{

font-size:30px;

}

.instructions{

font-size:18px;

}

.questionBoard{

font-size:22px;

}

.card{

width:44vw;

height:44vw;

}

}

/**********************
UTILITY
**********************/

.hide{

display:none !important;

}

.show{

display:flex !important;

}

</style>
</head>

<body>

<div id="game">

    <!-- Splash Screen -->

    <div id="splash" class="screen">

        <img
        id="logo"
        src="assets/innovine-logo.png"
        alt="Innovine Logo">

    </div>

    <!-- Title Screen -->

    <div
    id="titleScreen"
    class="screen hidden">

        <h1 class="gameTitle">

            <span class="word1">Action</span>

            <span class="word2">Word</span>

        </h1>

        <button id="startBtn">

            Tap to Start

        </button>

    </div>

    <!-- Game Screen -->

    <div
    id="gameScreen"
    class="screen hidden">

        <div class="header">

            <h1>

                <span>Action</span>

                <span>Word</span>

            </h1>

            <div class="instructions">

                Read the sentence and tap on the correct action picture.

            </div>

        </div>

        <div class="questionArea">

            <div
            id="questionBoard"
            class="questionBoard">

                I can run.

            </div>

            <button
            id="speaker"
            title="Hear Again">

                🔊

            </button>

        </div>

        <div class="options">

            <div
            id="option1"
            class="card">

                <img
                id="img1"
                src=""
                alt="Option 1">

            </div>

            <div
            id="option2"
            class="card">

                <img
                id="img2"
                src=""
                alt="Option 2">

            </div>

        </div>

        <div id="message">

            Good Job!

        </div>

    </div>
      <!-- =========================
         END SCREEN
    ========================== -->

    <div
    id="endScreen"
    class="screen">

        <div id="confetti"></div>

        <h2>

            🎉 Great Job! 🎉

            <br><br>

            You Finished!

        </h2>

        <button id="playAgain">

            Play Again

        </button>

    </div>


    <!-- =========================
          AUDIO
    ========================== -->

    <audio
    id="correctSound"
    preload="auto">

        <source
        src="assets/clap.mp3"
        type="audio/mpeg">

    </audio>

    <audio
    id="wrongSound"
    preload="auto">

        <source
        src="assets/wrong.mp3"
        type="audio/mpeg">

    </audio>

</div>



<script>

/*************************************************
GAME DATA
*************************************************/

const rounds=[

{

sentence:"I can run.",

images:[
"assets/run.jpg",
"assets/brush.jpg"
],

answer:0

},

{

sentence:"I can brush.",

images:[
"assets/brush.jpg",
"assets/dig.jpg"
],

answer:0

},

{

sentence:"He can dig.",

images:[
"assets/run.jpg",
"assets/dig.jpg"
],

answer:1

},

{

sentence:"She can clap.",

images:[
"assets/cycle.png",
"assets/clap.png"
],

answer:1

},

{

sentence:"I can hop.",

images:[
"assets/jump.png",
"assets/hop.png"
],

answer:1

},

{

sentence:"He can cycle.",

images:[
"assets/cycle.png",
"assets/stretch.png"
],

answer:0

},

{

sentence:"I can nibble.",

images:[
"assets/nible.png",
"assets/clap.png"
],

answer:0

},

{

sentence:"I can jump.",

images:[
"assets/jump.png",
"assets/read.png"
],

answer:0

},

{

sentence:"I can stretch.",

images:[
"assets/hop.png",
"assets/stretch.png"
],

answer:1

},

{

sentence:"I can read.",

images:[
"assets/read.png",
"assets/jump.png"
],

answer:0

}

];


/*************************************************
ELEMENTS
*************************************************/

const splash=document.getElementById("splash");

const titleScreen=document.getElementById("titleScreen");

const gameScreen=document.getElementById("gameScreen");

const endScreen=document.getElementById("endScreen");

const startBtn=document.getElementById("startBtn");

const playAgain=document.getElementById("playAgain");

const questionBoard=document.getElementById("questionBoard");

const img1=document.getElementById("img1");

const img2=document.getElementById("img2");

const option1=document.getElementById("option1");

const option2=document.getElementById("option2");

const speaker=document.getElementById("speaker");

const message=document.getElementById("message");

const correctSound=document.getElementById("correctSound");

const wrongSound=document.getElementById("wrongSound");

let currentRound=0;

let locked=false;


/*************************************************
SPLASH SCREEN
*************************************************/

window.onload=function(){

setTimeout(()=>{

splash.classList.add("hidden");

titleScreen.classList.remove("hidden");

},5000);

};


/*************************************************
START BUTTON
*************************************************/

startBtn.onclick=function(){

titleScreen.classList.add("hidden");

gameScreen.classList.remove("hidden");

loadRound();

};

/*************************************************
LOAD ROUND
*************************************************/

function loadRound(){

locked=false;

message.style.display="none";

option1.classList.remove("correct","wrong");
option2.classList.remove("correct","wrong");

const r=rounds[currentRound];

questionBoard.innerHTML=r.sentence;

img1.src=r.images[0];
img2.src=r.images[1];

speakQuestion();

}


/*************************************************
VOICE NARRATION
*************************************************/

function speakQuestion(){

speechSynthesis.cancel();

const r=rounds[currentRound];

const text=
"Read the sentence and tap on the correct action picture. "
+r.sentence;

const speech=new SpeechSynthesisUtterance(text);

speech.rate=.85;
speech.pitch=1;
speech.volume=1;

speechSynthesis.speak(speech);

}


/*************************************************
SPEAKER BUTTON
*************************************************/

speaker.onclick=function(){

speakQuestion();

};


/*************************************************
IMAGE TAPS
*************************************************/

option1.onclick=function(){

checkAnswer(0);

};

option2.onclick=function(){

checkAnswer(1);

};


/*************************************************
CHECK ANSWER
*************************************************/

function checkAnswer(choice){

if(locked)return;

locked=true;

const answer=rounds[currentRound].answer;

if(choice===answer){

const card=
choice===0?
option1:
option2;

card.classList.add("correct");

correctSound.pause();
correctSound.currentTime=0;
correctSound.play();

message.style.display="block";

setTimeout(()=>{

message.style.display="none";

nextRound();

},2200);

}

else{

locked=false;

wrongSound.pause();
wrongSound.currentTime=0;
wrongSound.play();

const card=
choice===0?
option1:
option2;

card.classList.add("wrong");

setTimeout(()=>{

card.classList.remove("wrong");

},350);

}

}


/*************************************************
NEXT ROUND
*************************************************/

function nextRound(){

currentRound++;

if(currentRound>=rounds.length){

finishGame();

return;

}

loadRound();

}


/*************************************************
FINISH GAME
*************************************************/

function finishGame(){

gameScreen.classList.add("hidden");

endScreen.style.display="flex";

createConfetti();

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(

"Great Job! You finished the game."

);

speech.rate=.9;

speechSynthesis.speak(speech);

}


/*************************************************
PLAY AGAIN
*************************************************/


 playAgain.onclick=function(){

currentRound=0;

endScreen.style.display="none";

gameScreen.classList.add("hidden");

titleScreen.classList.add("hidden");

splash.classList.remove("hidden");

setTimeout(function(){

splash.classList.add("hidden");

titleScreen.classList.remove("hidden");

},5000);

};   


/*************************************************
CONFETTI
*************************************************/

function createConfetti(){

const container=document.getElementById("confetti");

container.innerHTML="";

const colours=[

"#FF595E",
"#FFCA3A",
"#8AC926",
"#1982C4",
"#6A4C93",
"#FF99C8"

];

for(let i=0;i<280;i++){

const piece=document.createElement("div");

piece.className="confetti";

piece.style.left=Math.random()*100+"%";

piece.style.background=

colours[
Math.floor(
Math.random()*colours.length
)
];

piece.style.animationDelay=

(Math.random()*3)+"s";

piece.style.animationDuration=

(3+Math.random()*2)+"s";

container.appendChild(piece);

}

}


/*************************************************
PRELOAD IMAGES
*************************************************/

rounds.forEach(r=>{

r.images.forEach(src=>{

const img=new Image();

img.src=src;

});

});

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,

user-scalable=no">

<title>Grouping Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
touch-action:none;
}

body{
font-family:Arial,sans-serif;
overflow:hidden;
height:100vh;
width:100vw;
background:url('assets/background.jpg') center center/cover no-repeat;
}

#logoScreen{
position:fixed;
inset:0;
background:white;
display:flex;
justify-content:center;
align-items:center;
z-index:9999;
}

#logoScreen img{
width:min(300px,70vw);
}

#gameContainer{
width:100%;
height:100%;
display:flex;
flex-direction:column;
padding:6px;
background:rgba(255,255,255,0.08);
}

header{
background:rgba(255,255,255,0.92);
border-radius:16px;
padding:6px;
text-align:center;
}

h1{
font-size:clamp(22px,4vw,40px);
color:#ff6b6b;
}

#roundText{
margin-top:2px;
font-weight:bold;
color:#444;
font-size:clamp(13px,2vw,18px);
}

#instructionBox{
margin-top:6px;
background:#fff8e7;
border-radius:16px;
padding:8px;
text-align:center;
}

#instruction{
font-size:clamp(16px,2vw,28px);
font-weight:bold;
color:#4b3f72;
line-height:1.2;
}

#speakBtn{
margin-top:6px;
padding:7px 14px;
border:none;
border-radius:10px;
background:#ffd166;
font-size:15px;
font-weight:bold;
cursor:pointer;
}

#gameArea{
position:relative;
flex:1;
margin-top:6px;
background:white;
border-radius:20px;
overflow:hidden;
border:4px solid white;
box-shadow:0 4px 10px rgba(0,0,0,0.15);
}

.item{
position:absolute;
display:flex;
justify-content:center;
align-items:center;
z-index:2;
}

.item img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}

canvas{
position:absolute;
top:0;
left:0;
z-index:10;
}

.glow{
animation:glow 1s infinite alternate;
}

@keyframes glow{
from{
filter:drop-shadow(0 0 2px #00ff88);
}
to{
filter:drop-shadow(0 0 14px #00ff88);
}
}

.shake{
animation:shake 0.4s;
}

@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-5px);}
50%{transform:translateX(5px);}
75%{transform:translateX(-5px);}
100%{transform:translateX(0);}
}

position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:clamp(40px,8vw,80px);
font-weight:bold;

z-index:20;

.correct{

.wrong{

#endScreen h2{

}

to{
transform:translateY(110vh) rotate(720deg);

}

</style>
</head>

<body>

<div id="logoScreen">
<img src="assets/innovine-logo.png">
</div>

<div id="gameContainer">

<header>
<h1>Grouping</h1>
<div id="roundText">Round 1 / 7</div>
</header>

<div id="instructionBox">

<div id="instruction"></div>

<button id="speakBtn">
🔊 Hear Again
</button>

</div>

<div id="gameArea">

<canvas id="drawCanvas"></canvas>

<div id="feedback"></div>

<div id="endScreen">

<h2>🎉 Great Job! 🎉</h2>

<button id="playAgain">
Play Again
</button>

</div>

</div>

</div>

<audio id="rightSound" src="assets/right.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<script>

const rounds = [

{
instruction:"Circle the socks to group them into 2.",
image:"assets/sock.png",
count:10,
group:2
},

{
instruction:"Circle the marbles to group them into 3.",
image:"assets/marble.png",
count:12,
group:3
},

{
instruction:"Circle the dice to group them into 5.",
image:"assets/dice.png",
count:15,
group:5
},

{
instruction:"Circle the balls to group them into 10.",
image:"assets/ball.png",
count:20,
group:10
},

{
instruction:"Circle the balloons to group them into 3.",
image:"assets/pink-balloon.png",
count:15,
group:3
},

{
instruction:"Circle the apples to group them into 5.",
image:"assets/apple.png",
count:20,
group:5
},

{
instruction:"Circle the cars to group them into 10.",
image:"assets/car.png",
count:20,
group:10
}

];

const gameArea =
document.getElementById("gameArea");

const canvas =
document.getElementById("drawCanvas");

const ctx = canvas.getContext("2d");

const instruction =
document.getElementById("instruction");

const roundText =
document.getElementById("roundText");

const rightSound =
document.getElementById("rightSound");

const wrongSound =
document.getElementById("wrongSound");

const clapSound =
document.getElementById("clapSound");

const feedback =
document.getElementById("feedback");

let currentRound = 0;

let grouped = [];

let drawing = false;

let points = [];

let wrongAttempts = 0;

let savedPaths = [];

function resizeCanvas(){

canvas.width = gameArea.clientWidth;

canvas.height = gameArea.clientHeight;

redrawSavedPaths();

}

window.addEventListener("resize",resizeCanvas);

function speak(text){

speechSynthesis.cancel();

const msg =
new SpeechSynthesisUtterance(text);

msg.rate = 0.9;

speechSynthesis.speak(msg);

}

document.getElementById("speakBtn")
.onclick=()=>{

speak(rounds[currentRound].instruction);

};

function startRound(){

grouped = [];

wrongAttempts = 0;

savedPaths = [];

points = [];

ctx.clearRect(0,0,canvas.width,canvas.height);

document.querySelectorAll(".item")
.forEach(el=>el.remove());

const round = rounds[currentRound];

instruction.textContent =
round.instruction;

roundText.textContent =
`Round ${currentRound+1} / 7`;

speak(round.instruction);

createItems(round);

}

function createItems(round){

const screenW = gameArea.clientWidth;
const screenH = gameArea.clientHeight;

let size;

if(screenW < 500){

size = 38;

}else if(screenW < 900){

size = 46;

}else{

size = 58;

}

const cols = 5;

const rows =
Math.ceil(round.count / cols);

/* REDUCED ROW GAPS */

const sidePadding = 30;

/* MAIN FIX */

const topPadding = 10;

const usableWidth =
screenW - sidePadding*2;

/* REDUCED TOTAL HEIGHT */

const usableHeight =
screenH * 0.68;

/* COMPACT ROWS */

const gapX =
usableWidth / (cols-1);

const gapY =
usableHeight / (rows-1);

for(let i=0;i<round.count;i++){

const item =
document.createElement("div");

item.className = "item";

item.dataset.index = i;

item.style.width = size + "px";

item.style.height = size + "px";

const img =
document.createElement("img");

img.src = round.image;

item.appendChild(img);

const col = i % cols;

const row = Math.floor(i / cols);

/* VERY SMALL RANDOMNESS */

const randomX =
Math.random()*4 - 2;

const randomY =
Math.random()*4 - 2;

item.style.left =
(sidePadding + gapX*col - size/2 + randomX)+"px";

item.style.top =
(topPadding + gapY*row + randomY)+"px";

gameArea.appendChild(item);

}

}

function showFeedback(text,correct){

feedback.innerHTML = text;

feedback.className =
correct ? "correct" : "wrong";

feedback.style.display = "block";

setTimeout(()=>{

feedback.style.display = "none";

},800);

}

function pointInPolygon(point, vs){

let x = point.x;
let y = point.y;

let inside = false;

for(let i=0,j=vs.length-1;
i<vs.length;
j=i++){

let xi = vs[i].x;
let yi = vs[i].y;

let xj = vs[j].x;
let yj = vs[j].y;

let intersect =
((yi > y)!=(yj > y))
&&
(x < (xj - xi) *
(y - yi) /
(yj - yi) + xi);

if(intersect) inside = !inside;

}

return inside;

}

function getSelectedItems(){

const items =
[...document.querySelectorAll(".item")];

return items.filter(item=>{

if(grouped.includes(item.dataset.index))
return false;

const rect =
item.getBoundingClientRect();

const parent =
gameArea.getBoundingClientRect();

const cx =
rect.left - parent.left + rect.width/2;

const cy =
rect.top - parent.top + rect.height/2;

const testPoints = [

{x:cx,y:cy},

{x:cx-14,y:cy},
{x:cx+14,y:cy},

{x:cx,y:cy-14},
{x:cx,y:cy+14}

];

let insideCount = 0;

testPoints.forEach(point=>{

if(pointInPolygon(point, points)){

insideCount++;

}

});

return insideCount >= 1;

});

}

function redrawSavedPaths(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle = "#00c853";

ctx.lineWidth = 6;

ctx.lineJoin = "round";

ctx.lineCap = "round";

savedPaths.forEach(path=>{

ctx.beginPath();

ctx.moveTo(path[0].x,path[0].y);

path.forEach(p=>{

ctx.lineTo(p.x,p.y);

});

ctx.stroke();

});

}

function drawCurrentPath(){

redrawSavedPaths();

if(points.length < 2) return;

ctx.beginPath();

ctx.moveTo(points[0].x,points[0].y);

points.forEach(p=>{

ctx.lineTo(p.x,p.y);

});

ctx.strokeStyle = "#00c853";

ctx.lineWidth = 6;

ctx.lineJoin = "round";

ctx.lineCap = "round";

ctx.stroke();

}

function getPos(e){

const rect =
canvas.getBoundingClientRect();

let x,y;

if(e.touches){

x = e.touches[0].clientX - rect.left;

y = e.touches[0].clientY - rect.top;

}else{

x = e.clientX - rect.left;

y = e.clientY - rect.top;

}

return {x,y};

}

function startDraw(e){

drawing = true;

points = [];

points.push(getPos(e));

}

function moveDraw(e){

if(!drawing) return;

points.push(getPos(e));

drawCurrentPath();

}

function endDraw(){

if(!drawing) return;

drawing = false;

if(points.length < 8){

redrawSavedPaths();

return;

}

points.push(points[0]);

drawCurrentPath();

const selected =
getSelectedItems();

const needed =
rounds[currentRound].group;

if(selected.length === needed){

selected.forEach(item=>{

if(!grouped.includes(item.dataset.index)){

grouped.push(item.dataset.index);

item.classList.add("glow");

}

});

savedPaths.push([...points]);

redrawSavedPaths();

rightSound.currentTime = 0;

rightSound.play();

showFeedback("✔",true);

if(grouped.length >=
rounds[currentRound].count){

setTimeout(()=>{

clapSound.currentTime = 0;

clapSound.play();

currentRound++;

if(currentRound >= rounds.length){

endGame();

}else{

startRound();

}

},1300);

}

}else{

wrongAttempts++;

wrongSound.currentTime = 0;

wrongSound.play();

showFeedback("✖",false);

gameArea.classList.add("shake");

setTimeout(()=>{

gameArea.classList.remove("shake");

},350);

redrawSavedPaths();

if(wrongAttempts >= 2){

const items =
[...document.querySelectorAll(".item")]
.filter(item=>
!grouped.includes(item.dataset.index));

for(let i=0;i<needed;i++){

if(items[i]){

items[i].classList.add("glow");

}

}

}

}

}

canvas.addEventListener(
"mousedown",
startDraw
);

canvas.addEventListener(
"mousemove",
moveDraw
);

canvas.addEventListener(
"mouseup",
endDraw
);

canvas.addEventListener(
"touchstart",
startDraw,
{passive:false}
);

canvas.addEventListener(
"touchmove",
moveDraw,
{passive:false}
);

canvas.addEventListener(
"touchend",
endDraw
);

function endGame(){

document.getElementById("endScreen")
.style.display = "flex";

createConfetti();

}

function createConfetti(){

for(let i=0;i<100;i++){

const confetti =
document.createElement("div");

confetti.className = "confetti";

confetti.style.left =
Math.random()*100 + "vw";

confetti.style.background =
`hsl(${Math.random()*360},80%,60%)`;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

confetti.style.width =
(Math.random()*8+5)+"px";

confetti.style.height =
confetti.style.width;

document.body.appendChild(confetti);

setTimeout(()=>{

confetti.remove();

},5000);

}

}

document.getElementById("playAgain")
.onclick=()=>{

currentRound = 0;

document.getElementById("endScreen")
.style.display = "none";

startRound();

};

setTimeout(()=>{

document.getElementById("logoScreen")
.style.display = "none";

resizeCanvas();

startRound();

},5000);

</script>

</body>
</html>

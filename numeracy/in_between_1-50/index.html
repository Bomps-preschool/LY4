<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>In-Between Numbers 1 to 50</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

body{
  background:
    radial-gradient(circle at 18% 18%, rgba(255,255,255,0.9) 0 2.5%, transparent 2.8%),
    radial-gradient(circle at 80% 16%, rgba(255,255,255,0.85) 0 3%, transparent 3.3%),
    linear-gradient(180deg,#65d9d8 0%,#99eee3 34%,#ffe7a7 35%,#ffd07c 72%,#e79a5b 100%);
}

/* decorative desert shapes */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 8% 86%, #b96b4d 0 9%, transparent 9.5%),
    radial-gradient(ellipse at 92% 84%, #b96b4d 0 12%, transparent 12.5%),
    radial-gradient(ellipse at 50% 98%, #c97b51 0 28%, transparent 28.5%);
  opacity:0.45;
  pointer-events:none;
}

.screen{
  width:100vw;
  height:100svh;
  overflow:hidden;
}

#logoScreen{
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen img{
  width:min(55vw,260px);
  height:auto;
}

#gameScreen{
  display:none;
  height:100svh;
  padding:1vh 2vw;
  grid-template-rows:auto auto 1fr auto;
  gap:0.8vh;
  position:relative;
}

#gameScreen::before{
  content:"🌵";
  position:absolute;
  left:3vw;
  bottom:8vh;
  font-size:clamp(48px,9vw,95px);
  opacity:0.9;
}

#gameScreen::after{
  content:"🌵";
  position:absolute;
  right:5vw;
  bottom:9vh;
  font-size:clamp(42px,8vw,85px);
  opacity:0.9;
}

.header{
  height:8vh;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  z-index:2;
}

.title{
  font-size:clamp(21px,5vw,46px);
  font-weight:900;
  color:#ff6b35;
  text-shadow:2px 2px white;
}

.score{
  background:white;
  padding:7px 12px;
  border-radius:18px;
  font-size:clamp(14px,3vw,22px);
  font-weight:900;
  color:#ff9000;
  box-shadow:0 3px 8px rgba(0,0,0,0.16);
}

.instruction{
  justify-self:center;
  background:white;
  padding:7px 16px;
  border-radius:24px;
  font-size:clamp(12px,2.7vw,19px);
  font-weight:800;
  color:#5d4639;
  text-align:center;
  max-width:94vw;
  box-shadow:0 3px 8px rgba(0,0,0,0.12);
  z-index:2;
}

.main{
  min-height:0;
  background:rgba(255,255,255,0.72);
  border-radius:28px;
  padding:1.5vh 2vw;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
  overflow:hidden;
  z-index:2;
}

.question-text{
  font-size:clamp(15px,3vw,26px);
  font-weight:900;
  color:#5c4539;
  text-align:center;
}

.puzzle-line{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:0;
  max-width:96vw;
}

.piece{
  width:clamp(54px,15vw,128px);
  height:clamp(58px,14vh,105px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(28px,7vw,58px);
  font-weight:900;
  color:white;
  text-shadow:2px 2px rgba(0,0,0,0.18);
  border:3px solid rgba(0,0,0,0.18);
  box-shadow:0 5px 10px rgba(0,0,0,0.18);
  position:relative;
}

.piece:not(:first-child){
  margin-left:-5px;
}

.piece:nth-child(1){background:#f4e600;}
.piece:nth-child(2){background:#ffbd2e;}
.piece:nth-child(3){background:#d9578b;}
.piece:nth-child(4){background:#f04a2d;}
.piece:nth-child(5){background:#b8c944;}

.piece:first-child{
  border-radius:12px 0 0 12px;
}

.piece:last-child{
  border-radius:0 12px 12px 0;
}

.missing{
  background:white !important;
  color:#ff6b35;
  border:4px dashed #ff6b35;
  text-shadow:none;
  animation:pulse 1s infinite alternate;
}

@keyframes pulse{
  from{transform:scale(1);}
  to{transform:scale(1.04);}
}

.piece::after{
  content:"";
  position:absolute;
  right:-12px;
  top:50%;
  transform:translateY(-50%);
  width:24px;
  height:24px;
  background:inherit;
  border-radius:50%;
  border:3px solid rgba(0,0,0,0.15);
  z-index:2;
}

.piece:last-child::after,
.missing::after{
  display:none;
}

.options-title{
  font-size:clamp(14px,3vw,22px);
  font-weight:900;
  color:#5c4539;
}

.options{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  width:min(92vw,720px);
}

.option{
  height:clamp(56px,12vh,95px);
  border:none;
  border-radius:18px;
  font-size:clamp(28px,7vw,54px);
  font-weight:900;
  color:white;
  text-shadow:2px 2px rgba(0,0,0,0.18);
  border:4px solid white;
  box-shadow:0 5px 10px rgba(0,0,0,0.18);
  cursor:pointer;
}

.option:nth-child(1){background:#f4e600;}
.option:nth-child(2){background:#ffbd2e;}
.option:nth-child(3){background:#d9578b;}
.option:nth-child(4){background:#f04a2d;}

.option:active{
  transform:scale(0.94);
}

.giggle{
  animation:giggle 0.35s linear;
}

@keyframes giggle{
  0%{transform:translateX(0) rotate(0);}
  20%{transform:translateX(-8px) rotate(-5deg);}
  40%{transform:translateX(8px) rotate(5deg);}
  60%{transform:translateX(-6px) rotate(-4deg);}
  80%{transform:translateX(6px) rotate(4deg);}
  100%{transform:translateX(0) rotate(0);}
}

.message{
  height:5vh;
  min-height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(14px,3vw,22px);
  font-weight:900;
  color:#177f3d;
  z-index:2;
}

#endScreen{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.end-card{
  background:white;
  border-radius:28px;
  padding:30px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.22);
  z-index:30;
}

.end-card h2{
  font-size:clamp(30px,7vw,54px);
  color:#ff7048;
  margin-bottom:14px;
}

.end-card p{
  font-size:clamp(18px,4vw,28px);
  font-weight:800;
  color:#444;
}

.end-card button{
  margin-top:20px;
  padding:14px 26px;
  border:none;
  border-radius:18px;
  background:#ffb347;
  color:white;
  font-size:20px;
  font-weight:900;
}

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:16px;
  z-index:25;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

@media(max-width:700px){
  #gameScreen{
    padding:0.8vh 2vw;
    gap:0.5vh;
  }

  .header{
    height:7vh;
    min-height:40px;
  }

  .title{
    font-size:clamp(19px,6vw,30px);
  }

  .score{
    font-size:14px;
    padding:7px 9px;
  }

  .instruction{
    font-size:clamp(12px,3vw,15px);
    padding:7px 12px;
  }

  .main{
    border-radius:22px;
    padding:1vh 1.5vw;
  }

  .piece{
    width:clamp(48px,18vw,76px);
    height:clamp(58px,12vh,78px);
    font-size:clamp(28px,9vw,42px);
  }

  .piece:not(:first-child){
    margin-left:-4px;
  }

  .piece::after{
    right:-10px;
    width:20px;
    height:20px;
  }

  .options{
    width:94vw;
    gap:7px;
  }

  .option{
    height:clamp(52px,10vh,70px);
    font-size:clamp(26px,9vw,40px);
    border-radius:15px;
  }

  .message{
    font-size:14px;
  }
}

@media(max-height:680px){
  .instruction{
    font-size:12px;
    padding:6px 10px;
  }

  .piece{
    height:54px;
    font-size:28px;
  }

  .option{
    height:48px;
    font-size:26px;
  }

  .message{
    min-height:20px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen" class="screen">

  <div class="header">
    <div class="title">🧩 In-Between Numbers</div>
    <div class="score">⭐ <span id="score">0</span>/15</div>
  </div>

  <div class="instruction">
    Tap the missing puzzle number to complete the number line.
  </div>

  <div class="main">
    <div class="question-text">Which number comes in between?</div>

    <div class="puzzle-line" id="puzzleLine"></div>

    <div class="options-title">Choose the missing piece:</div>

    <div class="options" id="optionsBox"></div>
  </div>

  <div class="message" id="message">Tap the correct puzzle piece.</div>

</div>

<div id="endScreen">
  <div class="end-card">
    <h2>🎉 Excellent!</h2>
    <p>You completed all puzzle questions!</p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
let allQuestions = [];
for(let start = 1; start <= 46; start++){
  const sequence = [start, start+1, start+2, start+3, start+4];
  const missingIndex = Math.floor(Math.random() * 3) + 1;
  allQuestions.push({
    sequence: sequence,
    missingIndex: missingIndex,
    answer: sequence[missingIndex]
  });
}

let questions = shuffle([...allQuestions]).slice(0,15);
let currentIndex = 0;
let score = 0;
let audioUnlocked = false;
let locked = false;

const puzzleLine = document.getElementById("puzzleLine");
const optionsBox = document.getElementById("optionsBox");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

function unlockAudio(){
  if(audioUnlocked) return;

  [correctSound, wrongSound, clapSound].forEach(sound=>{
    sound.volume = 0.01;
    sound.play().then(()=>{
      sound.pause();
      sound.currentTime = 0;
      sound.volume = 1;
    }).catch(()=>{});
  });

  audioUnlocked = true;
}

document.addEventListener("click", unlockAudio, {once:true});
document.addEventListener("touchstart", unlockAudio, {once:true});

function playSound(sound){
  try{
    sound.pause();
    sound.currentTime = 0;
    sound.volume = 1;
    sound.play().catch(()=>{});
  }catch(e){}
}

function shuffle(array){
  for(let i = array.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [array[i],array[j]] = [array[j],array[i]];
  }
  return array;
}

function makeOptions(answer){
  let options = [answer];

  while(options.length < 4){
    let wrong = Math.floor(Math.random() * 50) + 1;
    if(!options.includes(wrong) && wrong !== answer){
      options.push(wrong);
    }
  }

  return shuffle(options);
}

function loadQuestion(){
  if(currentIndex >= questions.length){
    finishGame();
    return;
  }

  locked = false;
  puzzleLine.innerHTML = "";
  optionsBox.innerHTML = "";
  message.textContent = "Tap the correct puzzle piece.";

  const current = questions[currentIndex];

  current.sequence.forEach((num,index)=>{
    const piece = document.createElement("div");
    piece.className = "piece";

    if(index === current.missingIndex){
      piece.classList.add("missing");
      piece.textContent = "_";
      piece.id = "missingPiece";
    }else{
      piece.textContent = num;
    }

    puzzleLine.appendChild(piece);
  });

  const options = makeOptions(current.answer);

  options.forEach(num=>{
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = num;

    btn.addEventListener("click",()=>{
      unlockAudio();

      if(locked) return;

      if(num === current.answer){
        locked = true;
        playSound(correctSound);

        const missingPiece = document.getElementById("missingPiece");
        missingPiece.textContent = num;
        missingPiece.classList.remove("missing");

        score++;
        scoreText.textContent = score;
        message.textContent = "✅ Good job!";

        setTimeout(()=>{
          currentIndex++;
          loadQuestion();
        },900);

      }else{
        playSound(wrongSound);
        message.textContent = "Try again.";

        btn.classList.remove("giggle");
        void btn.offsetWidth;
        btn.classList.add("giggle");
      }
    });

    optionsBox.appendChild(btn);
  });
}

function createConfetti(){
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff8fab"];

  for(let i = 0; i < 90; i++){
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 1.5 + "s";
    piece.style.animationDuration = (2.5 + Math.random() * 1.8) + "s";
    document.body.appendChild(piece);

    setTimeout(()=>piece.remove(),5000);
  }
}

function finishGame(){
  playSound(clapSound);
  document.getElementById("endScreen").style.display = "flex";
  createConfetti();
}

setTimeout(()=>{
  document.getElementById("logoScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "grid";
  loadQuestion();
},2000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>More Than, Less Than and Equal To</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color: transparent;
}

body{
  font-family: Arial, sans-serif;
  overflow:hidden;
  background: linear-gradient(to bottom right,#ffe8b5,#ffd6e7,#d6f0ff);
  height:100vh;
  width:100vw;
}

#logoScreen,
#startScreen,
#gameScreen,
#endScreen{
  width:100%;
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.hidden{
  display:none !important;
}

/* LOGO */

#logoScreen{
  background:white;
}

#logoScreen img{
  width:min(300px,70vw);
  animation: pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.05);}
  100%{transform:scale(1);}
}

/* START */

#startScreen{
  text-align:center;
  padding:20px;
}

.game-title{
  font-size:clamp(28px,5vw,50px);
  color:#ff6b35;
  font-weight:bold;
  margin-bottom:20px;
  text-shadow:2px 2px 0 white;
}

.start-btn,
.play-again-btn,
.speaker-btn{
  background:#ffb703;
  border:none;
  border-radius:18px;
  padding:14px 28px;
  font-size:22px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  box-shadow:0 4px 0 #d98c00;
}

.start-btn:active,
.play-again-btn:active{
  transform:translateY(3px);
}

/* GAME */

#gameScreen{
  padding:10px;
  justify-content:flex-start;
}

.top-bar{
  width:100%;
  text-align:center;
  margin-top:8px;
}

.main-title{
  font-size:clamp(22px,4vw,42px);
  color:#ff5722;
  font-weight:bold;
}

.instruction-wrap{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-top:10px;
  flex-wrap:wrap;
}

.instruction{
  font-size:clamp(15px,2vw,24px);
  color:#2b2b2b;
  font-weight:bold;
  background:white;
  padding:10px 16px;
  border-radius:15px;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.speaker-btn{
  padding:10px 14px;
  font-size:20px;
}

/* GAME BOARD */

.game-board{
  width:min(1100px,96vw);
  height:58vh;
  background:linear-gradient(to bottom right,#fff8dc,#e8f9ff,#fff0f6);
  margin-top:18px;
  border-radius:25px;
  box-shadow:0 6px 18px rgba(0,0,0,0.15);
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  justify-items:center;
  padding:18px;
  gap:10px;
}

.object-side{
  width:100%;
  height:100%;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(55px,1fr));
  align-content:center;
  justify-items:center;
  gap:8px;
}

.object-side img{
  width:clamp(42px,6vw,75px);
  height:auto;
  object-fit:contain;
}

/* DROP BOX */

.drop-zone{
  width:clamp(85px,12vw,120px);
  height:clamp(85px,12vw,120px);
  border:4px dashed #ff9800;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  font-weight:bold;
  background:#ffffff;
  color:#333;
}

/* SYMBOLS */

.symbols{
  margin-top:18px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  justify-content:center;
}

.symbol{
  width:90px;
  height:90px;
  border-radius:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:55px;
  font-weight:bold;
  cursor:grab;
  box-shadow:0 5px 14px rgba(0,0,0,0.18);
  touch-action:none;
  color:white;
  transition:0.2s;
}

.symbol:nth-child(1){
  background:linear-gradient(to bottom,#ff6b6b,#ff3d3d);
  border:4px solid #ffb3b3;
}

.symbol:nth-child(2){
  background:linear-gradient(to bottom,#4dabf7,#1c7ed6);
  border:4px solid #b6dcff;
}

.symbol:nth-child(3){
  background:linear-gradient(to bottom,#51cf66,#2f9e44);
  border:4px solid #b7f5c1;
}

.symbol:hover{
  transform:scale(1.06);
}

.symbol:active{
  cursor:grabbing;
}

.correct-glow{
  animation:glow 1s infinite;
}

@keyframes glow{
  0%{box-shadow:0 0 5px gold;}
  50%{box-shadow:0 0 25px gold;}
  100%{box-shadow:0 0 5px gold;}
}

.wiggle{
  animation:wiggle 0.3s;
}

@keyframes wiggle{
  0%{transform:translateX(0);}
  25%{transform:translateX(-6px);}
  50%{transform:translateX(6px);}
  75%{transform:translateX(-6px);}
  100%{transform:translateX(0);}
}

.feedback{
  margin-top:10px;
  font-size:32px;
  font-weight:bold;
  color:#43a047;
  height:40px;
}

/* END SCREEN */

#endScreen{
  text-align:center;
  padding:20px;
}

.end-title{
  font-size:clamp(30px,5vw,55px);
  color:#ff5722;
  margin-bottom:20px;
}

/* MOBILE */

@media(max-width:768px){

  .game-board{
    height:54vh;
    padding:10px;
    gap:5px;
  }

  .object-side{
    grid-template-columns:repeat(auto-fit,minmax(40px,1fr));
    gap:4px;
  }

  .symbol{
    width:72px;
    height:72px;
    font-size:42px;
  }

  .drop-zone{
    width:72px;
    height:72px;
    font-size:42px;
  }

  .feedback{
    font-size:24px;
  }
}

</style>
</head>

<body>

<audio id="rightSound" src="assets/right.mp3"></audio>
<audio id="wrongSound" src="assets/wrong.mp3"></audio>
<audio id="clapSound" src="assets/clapping.mp3"></audio>

<!-- LOGO SCREEN -->

<div id="logoScreen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- START SCREEN -->

<div id="startScreen" class="hidden">
  <div class="game-title">More Than, Less Than and Equal To</div>
  <button class="start-btn" onclick="startGame()">Start Game</button>
</div>

<!-- GAME SCREEN -->

<div id="gameScreen" class="hidden">

  <div class="top-bar">

    <div class="main-title">
      More Than, Less Than and Equal To
    </div>

    <div class="instruction-wrap">

      <div class="instruction">
        Count the objects on both the sides and insert the correct symbol.
      </div>

      <button class="speaker-btn" onclick="speakInstruction()">
        🔊
      </button>

    </div>

  </div>

  <div class="game-board">

    <div class="object-side" id="leftSide"></div>

    <div class="drop-zone" id="dropZone"></div>

    <div class="object-side" id="rightSide"></div>

  </div>

  <div class="symbols">

    <div class="symbol" draggable="true" data-symbol=">">
      &gt;
    </div>

    <div class="symbol" draggable="true" data-symbol="<">
      &lt;
    </div>

    <div class="symbol" draggable="true" data-symbol="=">
      =
    </div>

  </div>

  <div class="feedback" id="feedback"></div>

</div>

<!-- END SCREEN -->

<div id="endScreen" class="hidden">

  <div class="end-title">
    🎉 Great Job! 🎉
  </div>

  <button class="play-again-btn" onclick="location.reload()">
    Play Again
  </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>

const rounds = [

  {
    image:"assets/turtle.png",
    left:9,
    right:4,
    answer:">"
  },

  {
    image:"assets/apple.png",
    left:5,
    right:8,
    answer:"<"
  },

  {
    image:"assets/ball.png",
    left:10,
    right:10,
    answer:"="
  },

  {
    image:"assets/bird.png",
    left:3,
    right:7,
    answer:"<"
  },

  {
    image:"assets/book.png",
    left:2,
    right:2,
    answer:"="
  },

  {
    image:"assets/car.png",
    left:6,
    right:10,
    answer:"<"
  },

  {
    image:"assets/doll.png",
    left:8,
    right:8,
    answer:"="
  },

  {
    image:"assets/orange.png",
    left:7,
    right:9,
    answer:"<"
  }

];

let currentRound = 0;
let wrongAttempts = 0;

const leftSide = document.getElementById("leftSide");
const rightSide = document.getElementById("rightSide");
const dropZone = document.getElementById("dropZone");
const feedback = document.getElementById("feedback");

const rightSound = document.getElementById("rightSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

setTimeout(()=>{

  document.getElementById("logoScreen").classList.add("hidden");
  document.getElementById("startScreen").classList.remove("hidden");

},5000);

function startGame(){

  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");

  loadRound();
}

function loadRound(){

  feedback.innerHTML = "";
  dropZone.innerHTML = "";

  wrongAttempts = 0;

  const round = rounds[currentRound];

  leftSide.innerHTML = "";
  rightSide.innerHTML = "";

  for(let i=0;i<round.left;i++){

    const img = document.createElement("img");
    img.src = round.image;

    leftSide.appendChild(img);
  }

  for(let i=0;i<round.right;i++){

    const img = document.createElement("img");
    img.src = round.image;

    rightSide.appendChild(img);
  }

  speakInstruction();
}

function speakInstruction(){

  const text =
  "Count the objects on both the sides and insert the correct symbol.";

  speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);

  utterance.rate = 0.9;
  utterance.pitch = 1;

  speechSynthesis.speak(utterance);
}

const symbols = document.querySelectorAll(".symbol");

symbols.forEach(symbol=>{

  symbol.addEventListener("dragstart",(e)=>{

    e.dataTransfer.setData("text",symbol.dataset.symbol);
  });

  symbol.addEventListener("touchstart",touchStart,{passive:false});
});

dropZone.addEventListener("dragover",(e)=>{

  e.preventDefault();
});

dropZone.addEventListener("drop",(e)=>{

  e.preventDefault();

  const symbol = e.dataTransfer.getData("text");

  checkAnswer(symbol);
});

let draggedSymbol = null;

function touchStart(e){

  draggedSymbol = e.target.dataset.symbol;

  document.addEventListener("touchend",touchEnd);
}

function touchEnd(e){

  const touch = e.changedTouches[0];

  const dropRect = dropZone.getBoundingClientRect();

  if(
    touch.clientX > dropRect.left &&
    touch.clientX < dropRect.right &&
    touch.clientY > dropRect.top &&
    touch.clientY < dropRect.bottom
  ){

    checkAnswer(draggedSymbol);
  }

  document.removeEventListener("touchend",touchEnd);
}

function checkAnswer(symbol){

  const correct = rounds[currentRound].answer;

  if(symbol === correct){

    dropZone.innerHTML = symbol;

    rightSound.currentTime = 0;
    rightSound.play();

    clapSound.currentTime = 0;
    clapSound.play();

    feedback.innerHTML = "✅ Good Job!";

    setTimeout(()=>{

      currentRound++;

      if(currentRound < rounds.length){

        loadRound();

      }else{

        endGame();
      }

    },1800);

  }else{

    wrongAttempts++;

    wrongSound.currentTime = 0;
    wrongSound.play();

    feedback.innerHTML = "❌ Try Again";

    document.querySelectorAll(".symbol").forEach(s=>{

      if(s.dataset.symbol === symbol){

        s.classList.add("wiggle");

        setTimeout(()=>{

          s.classList.remove("wiggle");

        },300);
      }
    });

    if(wrongAttempts >= 2){

      document.querySelectorAll(".symbol").forEach(s=>{

        if(s.dataset.symbol === correct){

          s.classList.add("correct-glow");
        }
      });
    }
  }
}

function endGame(){

  document.getElementById("gameScreen").classList.add("hidden");

  document.getElementById("endScreen").classList.remove("hidden");

  confetti({
    particleCount:200,
    spread:120,
    origin:{y:0.6}
  });
}

</script>

</body>
</html>

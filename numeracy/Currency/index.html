<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Currency</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:'Baloo 2',cursive;
}

/*------------------------------------
BACKGROUND
------------------------------------*/

body{

background:

radial-gradient(circle at 12% 15%, rgba(255,235,59,.55) 0%, transparent 20%),

radial-gradient(circle at 88% 18%, rgba(255,183,77,.45) 0%, transparent 18%),

radial-gradient(circle at 15% 82%, rgba(79,195,247,.40) 0%, transparent 22%),

radial-gradient(circle at 88% 82%, rgba(129,199,132,.45) 0%, transparent 20%),

radial-gradient(circle at 50% 50%, rgba(255,255,255,.30) 0%, transparent 35%),

linear-gradient(180deg,#DFF4FF 0%,#FFF8E1 50%,#F8EAFB 100%);

display:flex;
justify-content:center;
align-items:center;

overflow:hidden;

}

/*------------------------------------
COMMON
------------------------------------*/

.hidden{
display:none!important;
}

.screen{

position:absolute;
inset:0;

display:flex;
flex-direction:column;
justify-content:center;
align-items:center;

}

/*------------------------------------
LOGO
------------------------------------*/

#logo{

width:min(72vw,420px);

animation:
zoomLogo 1.8s ease-in-out infinite alternate;

}

@keyframes zoomLogo{

from{
transform:scale(.96);
}

to{
transform:scale(1.05);
}

}

/*------------------------------------
TITLE
------------------------------------*/

#gameTitle{

font-size:clamp(46px,7vw,80px);

font-weight:800;

background:
linear-gradient(90deg,
#F44336,
#FB8C00,
#FDD835,
#43A047,
#1E88E5,
#8E24AA);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

animation:flashTitle .9s infinite alternate;

margin-bottom:45px;

}

@keyframes flashTitle{

from{

transform:scale(1);

}

to{

transform:scale(1.08);

}

}

/*------------------------------------
START BUTTON
------------------------------------*/

#startBtn{

padding:18px 46px;

font-size:28px;

font-weight:700;

border:none;

border-radius:60px;

cursor:pointer;

color:white;

background:linear-gradient(135deg,#26A69A,#66BB6A);

box-shadow:0 8px 20px rgba(0,0,0,.25);

animation:pulse 1.4s infinite;

}

@keyframes pulse{

0%{

transform:scale(1);

}

50%{

transform:scale(1.08);

}

100%{

transform:scale(1);

}

}

/*------------------------------------
GAME SCREEN
------------------------------------*/

#gameScreen{

position:absolute;
inset:0;

padding:1vh 2vw;

display:flex;
flex-direction:column;

}

/*------------------------------------
HEADER
------------------------------------*/

.title{

text-align:center;

font-size:clamp(34px,5vw,56px);

font-weight:800;

background:
linear-gradient(90deg,
#EF5350,
#FFB300,
#66BB6A,
#42A5F5,
#AB47BC);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

margin-bottom:.8vh;

}

/*------------------------------------
QUESTION BAR
------------------------------------*/

#questionBar{

display:flex;
align-items:center;
justify-content:center;
gap:12px;

width:min(820px,92vw);

margin:auto;

background:linear-gradient(135deg,#FFFDE7,#E3F2FD);

border-radius:18px;

padding:8px 14px;

border:3px solid #64B5F6;

box-shadow:0 5px 12px rgba(0,0,0,.12);

}

#question{

flex:1;

font-size:clamp(18px,2.4vw,27px);

font-weight:700;

line-height:1.35;

text-align:center;

color:#37474F;

}

#speakerBtn{

width:52px;

height:52px;

font-size:24px;

border:none;

border-radius:50%;

background:#FFD54F;

cursor:pointer;

box-shadow:0 4px 10px rgba(0,0,0,.2);

}

#speakerBtn:active{

transform:scale(.92);

}
/*------------------------------------
GAME CARD
------------------------------------*/

#gameCard{

flex:1;

display:flex;

flex-direction:column;

justify-content:space-evenly;

align-items:center;

padding:1vh;

}

/*------------------------------------
PRODUCT AREA
------------------------------------*/

#productArea{

display:flex;

flex-direction:column;

align-items:center;

gap:10px;

}

#productImage{

width:min(30vw,210px);

height:min(30vw,210px);

max-height:20vh;

object-fit:contain;

background:#fff;

border:6px solid #81C784;

border-radius:24px;

padding:10px;

box-shadow:0 8px 20px rgba(0,0,0,.18);

}

#productName{

font-size:clamp(22px,3vw,34px);

color:#5D4037;

font-weight:700;

}

/*------------------------------------
PRICE BADGE
------------------------------------*/

#priceBadge{

display:flex;

align-items:center;

justify-content:center;

gap:8px;

padding:8px 22px;

border-radius:40px;

background:linear-gradient(180deg,#FFE082,#FFD54F);

border:3px solid #F9A825;

box-shadow:0 6px 12px rgba(0,0,0,.15);

}

.money{

font-size:30px;

}

#priceText{

font-size:clamp(24px,3.5vw,34px);

font-weight:800;

color:#6D4C41;

}

@keyframes pricePop{

0%{

transform:scale(.6);

opacity:0;

}

70%{

transform:scale(1.08);

}

100%{

transform:scale(1);

opacity:1;

}

}

/*------------------------------------
OPTIONS
------------------------------------*/

#options{

width:100%;

display:flex;

justify-content:center;

gap:3vw;

flex-wrap:nowrap;

margin-top:10px;

}

.currencyCard{

width:min(24vw,190px);

height:min(18vw,140px);

max-height:18vh;

background:white;

border-radius:20px;

border:5px solid #90CAF9;

display:flex;

justify-content:center;

align-items:center;

cursor:pointer;

box-shadow:0 6px 14px rgba(0,0,0,.18);

transition:.25s;

}

.currencyCard:hover{

transform:translateY(-5px);

}

.currencyCard img{

max-width:90%;

max-height:90%;

object-fit:contain;

pointer-events:none;

}

/*------------------------------------
CORRECT
------------------------------------*/

.correct{

border-color:#4CAF50!important;

box-shadow:0 0 25px #66BB6A!important;

transform:scale(1.05);

}

/*------------------------------------
WRONG
------------------------------------*/

.wrong{

animation:shake .35s;

}

@keyframes shake{

0%{transform:translateX(0);}
20%{transform:translateX(-8px);}
40%{transform:translateX(8px);}
60%{transform:translateX(-8px);}
80%{transform:translateX(8px);}
100%{transform:translateX(0);}

}

/*------------------------------------
GOOD JOB
------------------------------------*/

#goodJob{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

font-size:clamp(40px,6vw,72px);

font-weight:800;

background:
linear-gradient(90deg,
#F44336,
#FB8C00,
#FDD835,
#43A047,
#1E88E5,
#8E24AA);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

animation:goodZoom .9s infinite alternate;

z-index:500;

pointer-events:none;

}

@keyframes goodZoom{

from{

transform:translate(-50%,-50%) scale(1);

}

to{

transform:translate(-50%,-50%) scale(1.12);

}

}

/*------------------------------------
FINISH SCREEN
------------------------------------*/

#finishScreen{

position:absolute;

inset:0;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

gap:25px;

background:rgba(255,255,255,.95);

z-index:900;

}

.finishTitle{

font-size:clamp(42px,7vw,72px);

background:
linear-gradient(90deg,
#F44336,
#FB8C00,
#FDD835,
#43A047,
#1E88E5,
#8E24AA);

-webkit-background-clip:text;

-webkit-text-fill-color:transparent;

}

#finishScreen h2{

font-size:clamp(24px,3vw,36px);

color:#5D4037;

}

#playAgain{

padding:18px 42px;

font-size:28px;

font-weight:700;

border:none;

border-radius:50px;

cursor:pointer;

background:#66BB6A;

color:white;

box-shadow:0 8px 18px rgba(0,0,0,.2);

animation:pulse 1.4s infinite;

}

/*------------------------------------
CONFETTI
------------------------------------*/

#confetti{

position:fixed;

top:0;
left:0;

width:100%;
height:100%;

pointer-events:none;

z-index:9999;

}

/*------------------------------------
RESPONSIVE
------------------------------------*/

@media(max-width:700px){

#productImage{

width:42vw;

height:42vw;

max-height:22vh;

}

.currencyCard{

width:28vw;

height:20vw;

}

#speakerBtn{

width:54px;

height:54px;

font-size:26px;

}

#question{

font-size:20px;

}

#priceBadge{

padding:12px 24px;

}

#priceText{

font-size:34px;

}

}

</style>

</head>

<body>

<!-- Splash Screen -->
<div id="logoScreen" class="screen">
    <img src="assets/innovine-logo.png" id="logo">
</div>

<!-- Title Screen -->
<div id="titleScreen" class="screen hidden">

    <h1 id="gameTitle">Currency</h1>

    <button id="startBtn">
        Tap to Start
    </button>

</div>

<!-- Main Game -->
<div id="gameScreen" class="hidden">

<header>

<h1 class="title">
Currency
</h1>

<div id="questionBar">

<p id="question"></p>

<button id="speakerBtn" title="Hear Again">
🔊
</button>

</div>

</header>


<div id="gameCard">

<div id="productArea">

<img id="productImage" src="" alt="Product">

<h2 id="productName"></h2>

<div id="priceBadge">

<span class="money">
💰
</span>

<span id="priceText">
₹10
</span>

</div>

</div>


<div id="options">

<div class="currencyCard">
<img id="opt0">
</div>

<div class="currencyCard">
<img id="opt1">
</div>

<div class="currencyCard">
<img id="opt2">
</div>

</div>

</div>

</div>


<!-- Good Job -->

<div id="goodJob" class="hidden">

Good Job!

</div>


<!-- Finish Screen -->

<div id="finishScreen" class="hidden">

<h1 class="finishTitle">

🎉 Fantastic! 🎉

</h1>

<h2>

You bought everything!

</h2>

<button id="playAgain">

▶ Play Again

</button>

</div>


<!-- Confetti Canvas -->

<canvas id="confetti"></canvas>


<!-- Sounds -->

<audio id="clapSound" src="assets/clap.mp3"></audio>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>


<script>
  
/*==================================================
DOM ELEMENTS
==================================================*/

const logoScreen=document.getElementById("logoScreen");
const titleScreen=document.getElementById("titleScreen");
const gameScreen=document.getElementById("gameScreen");

const question=document.getElementById("question");
const productImage=document.getElementById("productImage");
const productName=document.getElementById("productName");
const priceText=document.getElementById("priceText");

const speakerBtn=document.getElementById("speakerBtn");
const startBtn=document.getElementById("startBtn");

const clapSound=document.getElementById("clapSound");
const wrongSound=document.getElementById("wrongSound");

const goodJob=document.getElementById("goodJob");
const finishScreen=document.getElementById("finishScreen");
const playAgain=document.getElementById("playAgain");

const optionCards=document.querySelectorAll(".currencyCard");

const optionImages=[
document.getElementById("opt0"),
document.getElementById("opt1"),
document.getElementById("opt2")
];


/*==================================================
GAME VARIABLES
==================================================*/

let round=0;

let speakingText="";

let canClick=true;


/*==================================================
ALL ROUNDS
==================================================*/

const rounds=[

{

question:"The ball costs ten rupees. Tap the correct currency to buy it.",

displayQuestion:"The ball costs ₹10. Tap the correct currency to buy it.",

image:"assets/ball.png",

name:"Ball",

price:"₹10",

options:[

"assets/currencies-02.png",

"assets/currencies-04.png",

"assets/currencies-05.png"

],

answer:1

},

{

question:"The yoyo costs one hundred rupees. Tap the correct currency to buy it.",

displayQuestion:"The yoyo costs ₹100. Tap the correct currency to buy it.",

image:"assets/yoyo.png",

name:"Yoyo",

price:"₹100",

options:[

"assets/currencies-09.png",

"assets/currencies-08.png",

"assets/currencies-10.png"

],

answer:2

},

{

question:"The jam costs two hundred rupees. Tap the correct currency to buy it.",

displayQuestion:"The jam costs ₹200. Tap the correct currency to buy it.",

image:"assets/jam.jpg",

name:"Jam",

price:"₹200",

options:[

"assets/currencies-11.png",

"assets/currencies-10.png",

"assets/currencies-05.png"

],

answer:0

},

{

question:"The umbrella costs five hundred rupees. Tap the correct currency to buy it.",

displayQuestion:"The umbrella costs ₹500. Tap the correct currency to buy it.",

image:"assets/umbrella.jpeg",

name:"Umbrella",

price:"₹500",

options:[

"assets/currencies-06.png",

"assets/currencies-09.png",

"assets/currencies-12.png"

],

answer:2

},

{

question:"The bat costs twenty rupees. Tap the correct currency to buy it.",

displayQuestion:"The bat costs ₹20. Tap the correct currency to buy it.",

image:"assets/bat.png",

name:"Bat",

price:"₹20",

options:[

"assets/currencies-01.png",

"assets/currencies-03.png",

"assets/currencies-05.png"

],

answer:2

},

{

question:"The popcorn costs fifty rupees. Tap the correct currency to buy it.",

displayQuestion:"The popcorn costs ₹50. Tap the correct currency to buy it.",

image:"assets/popcorn.png",

name:"Popcorn",

price:"₹50",

options:[

"assets/currencies-09.png",

"assets/currencies-07.png",

"assets/currencies-08.png"

],

answer:0

},

{

question:"The car costs one hundred rupees. Tap the correct currency to buy it.",

displayQuestion:"The car costs ₹100. Tap the correct currency to buy it.",

image:"assets/car.png",

name:"Car",

price:"₹100",

options:[

"assets/currencies-08.png",

"assets/currencies-09.png",

"assets/currencies-10.png"

],

answer:2

},

{

question:"The watch costs two hundred rupees. Tap the correct currency to buy it.",

displayQuestion:"The watch costs ₹200. Tap the correct currency to buy it.",

image:"assets/watch.png",

name:"Watch",

price:"₹200",

options:[

"assets/currencies-12.png",

"assets/currencies-11.png",

"assets/currencies-06.png"

],

answer:1

},

{

question:"The candy costs five rupees. Tap the correct currency to buy it.",

displayQuestion:"The candy costs ₹5. Tap the correct currency to buy it.",

image:"assets/candy.png",

name:"Candy",

price:"₹5",

options:[

"assets/currencies-03.png",

"assets/currencies-01.png",

"assets/currencies-02.png"

],

answer:0

},

{

question:"The watermelon costs fifty rupees. Tap the correct currency to buy it.",

displayQuestion:"The watermelon costs ₹50. Tap the correct currency to buy it.",

image:"assets/watermelon.png",

name:"Watermelon",

price:"₹50",

options:[

"assets/currencies-05.png",

"assets/currencies-09.png",

"assets/currencies-08.png"

],

answer:1

}

];
/*==================================================
VOICE NARRATION
==================================================*/

function speak(text){

speakingText=text;

if(!('speechSynthesis' in window)) return;

speechSynthesis.cancel();

const msg=new SpeechSynthesisUtterance(text);

msg.lang="en-IN";
msg.rate=0.9;
msg.pitch=1;

speechSynthesis.speak(msg);

}

/*==================================================
SPEAKER BUTTON
==================================================*/

speakerBtn.onclick=()=>{

speak(speakingText);

};

/*==================================================
SHOW ROUND
==================================================*/

function loadRound(){

canClick=true;

optionCards.forEach(card=>{

card.classList.remove("correct");
card.classList.remove("wrong");

});

const r=rounds[round];

question.textContent=r.displayQuestion;

productImage.src=r.image;

productName.textContent=r.name;

priceText.textContent=r.price;

for(let i=0;i<3;i++){

optionImages[i].src=r.options[i];

}

speak(r.question);

}

/*==================================================
START GAME
==================================================*/

startBtn.onclick=()=>{

titleScreen.classList.add("hidden");

gameScreen.classList.remove("hidden");

round=0;

loadRound();

};

/*==================================================
LOGO → TITLE
==================================================*/

window.onload=()=>{

logoScreen.classList.remove("hidden");

titleScreen.classList.add("hidden");

gameScreen.classList.add("hidden");

finishScreen.classList.add("hidden");

setTimeout(()=>{

logoScreen.classList.add("hidden");

titleScreen.classList.remove("hidden");

},5000);

};
/*==================================================
ANSWER CHECKING
==================================================*/

optionCards.forEach((card,index)=>{

card.onclick=()=>{

if(!canClick) return;

const current=rounds[round];

if(index===current.answer){

canClick=false;

card.classList.add("correct");

speechSynthesis.cancel();

goodJob.classList.remove("hidden");

clapSound.currentTime=0;
clapSound.play();

setTimeout(()=>{

goodJob.classList.add("hidden");

round++;

if(round<rounds.length){

loadRound();

}else{

finishGame();

}

},1800);

}else{

card.classList.add("wrong");

wrongSound.currentTime=0;
wrongSound.play();

setTimeout(()=>{

card.classList.remove("wrong");

},400);

}

};

});


/*==================================================
FINISH GAME
==================================================*/

function finishGame(){

gameScreen.classList.add("hidden");

finishScreen.classList.remove("hidden");

setTimeout(()=>{

launchConfetti();

},150);

}


/*==================================================
PLAY AGAIN
==================================================*/

playAgain.onclick=()=>{

speechSynthesis.cancel();

finishScreen.classList.add("hidden");

round=0;

logoScreen.classList.remove("hidden");

titleScreen.classList.add("hidden");

gameScreen.classList.add("hidden");

setTimeout(()=>{

logoScreen.classList.add("hidden");

titleScreen.classList.remove("hidden");

},5000);

};
/*==================================================
CONFETTI
==================================================*/

const canvas=document.getElementById("confetti");
const ctx=canvas.getContext("2d");

let pieces=[];

function resizeCanvas(){

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

}

window.addEventListener("resize",resizeCanvas);

resizeCanvas();

function launchConfetti(){

pieces=[];

const colours=[
"#F44336",
"#FF9800",
"#FFEB3B",
"#4CAF50",
"#03A9F4",
"#9C27B0",
"#E91E63"
];

for(let i=0;i<180;i++){

pieces.push({

x:Math.random()*canvas.width,

y:-Math.random()*canvas.height,

w:8+Math.random()*8,

h:8+Math.random()*8,

dx:-2+Math.random()*4,

dy:2+Math.random()*5,

rot:Math.random()*360,

dr:-6+Math.random()*12,

colour:colours[Math.floor(Math.random()*colours.length)]

});

}

animateConfetti();

}

function animateConfetti(){

ctx.clearRect(0,0,canvas.width,canvas.height);

pieces.forEach(p=>{

ctx.save();

ctx.translate(p.x,p.y);

ctx.rotate(p.rot*Math.PI/180);

ctx.fillStyle=p.colour;

ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);

ctx.restore();

p.x+=p.dx;
p.y+=p.dy;
p.rot+=p.dr;

});

pieces=pieces.filter(p=>p.y<canvas.height+30);

if(pieces.length){

requestAnimationFrame(animateConfetti);

}

}

/*==================================================
PREVENT DOUBLE TAP ZOOM
==================================================*/

document.addEventListener("dblclick",e=>{

e.preventDefault();

},{passive:false});

/*==================================================
IOS AUDIO FIX
==================================================*/

document.body.addEventListener("touchstart",()=>{

clapSound.load();
wrongSound.load();

},{once:true});

/*==================================================
STOP SPEECH WHEN LEAVING PAGE
==================================================*/

window.addEventListener("beforeunload",()=>{

speechSynthesis.cancel();

});

/*==================================================
END
==================================================*/  
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Subtraction - Senior KG</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="splash">
  <img src="assets/innovine-logo.png" alt="Innovine Solutions">
</div>

<div id="startScreen" class="screen">
  <div class="card">
    <div class="titleIcon">➖</div>
    <h1>Subtraction</h1>
    <p>Take away and find the answer.</p>
    <p>Tap the correct answer.</p>
    <button id="startBtn" type="button">▶ Start Game</button>
  </div>
</div>

<div id="game" class="hidden">
  <header>
    <h1>Subtraction</h1>
    <div class="topRow">
      <button id="hearBtn" type="button">🔊 Hear</button>
      <div id="progress">1 / 8</div>
      <div id="score">⭐ 0</div>
    </div>
  </header>

  <main>
    <section class="questionBox">
      <p id="instruction">Cross out to take away. What is left?</p>

      <div id="objects" class="objects"></div>

      <div class="equation">
        <span id="total">8</span>
        <span>−</span>
        <span id="takeAway">4</span>
        <span>=</span>
        <span>?</span>
      </div>

      <p class="choose">Tap the correct answer.</p>
      <div id="answers" class="answers"></div>
    </section>

    <div id="feedback" class="hidden"></div>
    <div id="confetti"></div>
  </main>
</div>

<div id="endScreen" class="screen hidden">
  <div class="card">
    <div class="titleIcon">🏆</div>
    <h1>Great Job!</h1>
    <p id="finalScore"></p>
    <p>🎉 You are a subtraction star!</p>
    <button id="againBtn" type="button">🔄 Play Again</button>
  </div>
</div>

<audio id="music" loop preload="auto">
  <source src="assets/background-music.mp3" type="audio/mpeg">
</audio>
<audio id="correctSound" preload="auto">
  <source src="assets/correct.mp3" type="audio/mpeg">
</audio>
<audio id="wrongSound" preload="auto">
  <source src="assets/wrong.mp3" type="audio/mpeg">
</audio>

<script src="speech.js"></script>
<script src="script.js"></script>
</body>
</html>

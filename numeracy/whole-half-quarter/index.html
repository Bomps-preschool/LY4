<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Magic Shape Painter</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    font-family:"Comic Sans MS", Arial, sans-serif;
}

button{
    font-family:inherit;
    cursor:pointer;
    touch-action:manipulation;
}

.screen{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    text-align:center;
}

/* =========================
   LOGO
========================= */

#logo{
    display:flex;
    background:white;
}

#logo img{
    width:260px;
    max-width:75%;
}


/* =========================
   INTRO / END
========================= */

#intro,
#game,
#end{

    background:
        linear-gradient(
            #fff2d8,
            #dff6ff,
            #f7e8ff
        );

    padding:20px;
}

.card{

    background:white;

    border:4px solid #e6a3c2;

    border-radius:30px;

    padding:30px;

    width:90%;

    max-width:900px;
}

.card p{

    font-size:22px;

    line-height:1.5;
}


/* =========================
   BUTTONS
========================= */

.start,
.action{

    background:#7bbf8c;

    color:white;

    border:none;

    border-radius:25px;

    padding:12px 30px;

    font-size:24px;

    margin:8px;
}

.start:active,
.action:active,
.speaker-button:active{

    transform:scale(0.95);
}


/* =========================
   HEADER
========================= */

.header{

    position:absolute;

    top:10px;
    left:10px;
    right:10px;

    background:white;

    padding:12px 18px;

    border-radius:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#51438b;

    font-size:20px;

    z-index:20;
}

.header-left{

    display:flex;

    align-items:center;

    gap:10px;
}

.speaker-button{

    width:45px;
    height:45px;

    padding:0;
    margin:0;

    border:none;

    border-radius:50%;

    background:#5dade2;

    color:white;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:24px;

    box-shadow:
        0 3px 8px rgba(0,0,0,0.15);
}


/* =========================
   GAME MAIN
========================= */

.main{

    background:white;

    border:4px solid #e6a3c2;

    border-radius:30px;

    padding:25px;

    display:flex;

    gap:30px;

    align-items:center;

    justify-content:center;

    width:92%;

    max-width:1000px;

    margin-top:55px;

    max-height:calc(100vh - 85px);

    overflow:hidden;
}


/* =========================
   QUESTION
========================= */

#question{

    color:#51438b;

    min-height:55px;

    margin-top:0;

    margin-bottom:10px;

    font-size:clamp(20px,3vw,32px);
}


/* =========================
   CANVAS WRAPPER
========================= */

.canvas-wrap{

    position:relative;

    width:350px;
    height:350px;

    max-width:40vw;
    max-height:50vh;

    flex-shrink:0;
}


/* =========================
   CANVAS
========================= */

#shapeCanvas{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    border:4px dashed #d84f91;

    border-radius:40px;

    background:white;

    touch-action:none;

    display:block;
}


/*
The original picture canvas sits behind
the transparent colouring canvas.
*/

#paintCanvas{

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:100%;

    border-radius:40px;

    touch-action:none;

    display:block;
}


/* =========================
   TARGET GUIDE
========================= */

#targetGuide{

    position:absolute;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    pointer-events:none;

    display:none;

    color:#d84f91;

    font-size:22px;

    font-weight:bold;

    background:rgba(255,255,255,0.85);

    padding:5px 12px;

    border-radius:15px;
}


/* =========================
   COLOURS
========================= */

.colors{

    display:flex;

    flex-wrap:wrap;

    justify-content:center;

    max-width:260px;
}

.colors button{

    width:65px;
    height:65px;

    border-radius:50%;

    margin:8px;

    border:4px solid white;

    box-shadow:
        0 3px 8px
        rgba(0,0,0,0.18);
}

.colors button.selected-colour{

    border:5px solid #51438b;

    transform:scale(1.12);
}

.red{
    background:red;
}

.yellow{
    background:#ffd166;
}

.green{
    background:#70d6a5;
}

.blue{
    background:#5dade2;
}

.purple{
    background:#b084f5;
}


/* =========================
   MESSAGE
========================= */

.msg{

    position:fixed;

    bottom:12px;
    left:50%;

    transform:translateX(-50%);

    min-width:260px;

    font-size:22px;

    color:#d84f91;

    background:white;

    padding:9px 20px;

    border-radius:20px;

    z-index:50;
}


/* =========================
   RESPONSIVE
========================= */

@media(max-width:800px){

    #intro,
    #game,
    #end{

        padding:8px;
    }

    .header{

        font-size:16px;

        padding:7px 10px;
    }

    .header-left{

        gap:6px;
    }

    .speaker-button{

        width:38px;
        height:38px;

        font-size:20px;
    }

    .main{

        flex-direction:column;

        gap:4px;

        padding:10px;

        margin-top:50px;

        width:96%;

        max-height:calc(100vh - 100px);
    }

    #question{

        font-size:19px;

        min-height:auto;

        margin:2px 0 5px;
    }

    .canvas-wrap{

        width:min(250px,55vw);

        height:min(250px,55vw);

        max-width:none;

        max-height:none;
    }

    #shapeCanvas,
    #paintCanvas{

        border-radius:25px;
    }

    .colors{

        max-width:100%;

        gap:0;
    }

    .colors button{

        width:44px;
        height:44px;

        margin:4px;
    }

    .action{

        font-size:17px;

        padding:8px 18px;

        margin:3px;
    }

    .msg{

        bottom:4px;

        font-size:16px;

        padding:6px 14px;

        min-width:230px;
    }

}


/* =========================
   SMALL PHONES
========================= */

@media(max-width:420px){

    .canvas-wrap{

        width:min(215px,52vw);

        height:min(215px,52vw);
    }

    .colors button{

        width:40px;
        height:40px;

        margin:3px;
    }

    .action{

        font-size:15px;

        padding:7px 14px;
    }

}


/* =========================
   SHORT SCREENS
========================= */

@media(max-height:650px){

    .main{

        transform:scale(0.88);

        margin-top:38px;
    }

}


/* =========================
   LANDSCAPE MOBILE
========================= */

@media(
    orientation:landscape
) and (
    max-height:600px
){

    .main{

        flex-direction:row;

        gap:15px;

        padding:10px;

        margin-top:42px;

        max-height:calc(100vh - 55px);
    }

    .canvas-wrap{

        width:min(270px,42vh);

        height:min(270px,42vh);
    }

    #question{

        font-size:18px;
    }

    .colors button{

        width:42px;
        height:42px;

        margin:3px;
    }

    .action{

        font-size:16px;

        padding:7px 14px;
    }

}

</style>

</head>

<body>


<!-- =========================
     LOGO
========================= -->

<div
    id="logo"
    class="screen">

    <img
        src="assets/innovine-logo.png"
        alt="Innovine Logo">

</div>


<!-- =========================
     INTRO
========================= -->

<div
    id="intro"
    class="screen">

    <div class="card">

        <h1>
            🎨 Magic Shape Painter
        </h1>

        <p>
            Listen carefully and colour the
            whole, half or quarter as asked.
        </p>

        <button
            class="start"
            onclick="startGame()">

            Start Painting

        </button>

    </div>

</div>


<!-- =========================
     GAME
========================= -->

<div
    id="game"
    class="screen">


    <div class="header">

        <div class="header-left">

            <b>
                🎨 Magic Shape Painter
            </b>

            <button
                class="speaker-button"
                onclick="speakCurrentInstruction()"
                aria-label="Repeat instruction">

                🔊

            </button>

        </div>

        <b>

            ⭐

            <span id="score">
                0
            </span>

            /10

        </b>

    </div>


    <div class="main">


        <div>

            <h2 id="question"></h2>


            <div class="canvas-wrap">

                <!-- Original object -->

                <canvas
                    id="shapeCanvas"
                    width="350"
                    height="350">
                </canvas>


                <!-- Learner painting -->

                <canvas
                    id="paintCanvas"
                    width="350"
                    height="350">
                </canvas>


                <div id="targetGuide"></div>

            </div>

        </div>


        <div>

            <p>
                Choose Colour
            </p>


            <div class="colors">

                <button
                    class="red selected-colour"
                    onclick="chooseColour('red',this)"
                    aria-label="Red">
                </button>

                <button
                    class="yellow"
                    onclick="chooseColour('#ffd166',this)"
                    aria-label="Yellow">
                </button>

                <button
                    class="green"
                    onclick="chooseColour('#70d6a5',this)"
                    aria-label="Green">
                </button>

                <button
                    class="blue"
                    onclick="chooseColour('#5dade2',this)"
                    aria-label="Blue">
                </button>

                <button
                    class="purple"
                    onclick="chooseColour('#b084f5',this)"
                    aria-label="Purple">
                </button>

            </div>


            <button
                class="action"
                onclick="clearPaint()">

                Clear

            </button>


            <button
                class="action"
                onclick="submitAnswer()">

                Submit

            </button>

        </div>

    </div>


    <div
        id="msg"
        class="msg">
    </div>

</div>


<!-- =========================
     END
========================= -->

<div
    id="end"
    class="screen">

    <div class="card">

        <h1>
            🎉 Amazing Painter!
        </h1>

        <h2 id="final"></h2>

        <button
            class="start"
            onclick="restartGame()">

            Play Again

        </button>

    </div>

</div>


<!-- =========================
     AUDIO
========================= -->

<audio
    id="correct"
    src="assets/correct.mp3"
    preload="auto">
</audio>

<audio
    id="wrong"
    src="assets/wrong.mp3"
    preload="auto">
</audio>

<audio
    id="clap"
    src="assets/claps.mp3"
    preload="auto">
</audio>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const originalQuestions = [

    ["pizza.png","whole","pizza"],

    ["circle.png","whole","circle"],

    ["balloon.png","whole","balloon"],

    ["cake.png","half","cake"],

    ["watermelon.png","half","watermelon"],

    ["square.png","half","square"],

    ["chocolate.png","quarter","chocolate"],

    ["hexagon.png","quarter","hexagon"],

    ["kiwi.png","quarter","kiwi"],

    ["pizza.png","quarter","pizza"]

];


/* =====================================================
   VARIABLES
===================================================== */

let questions = [];

let index = 0;

let score = 0;

let selected = "red";

let drawing = false;

let currentInstruction = "";

let speechEnabled = false;


/* =====================================================
   CANVAS
===================================================== */

const shapeCanvas =
    document.getElementById(
        "shapeCanvas"
    );

const paintCanvas =
    document.getElementById(
        "paintCanvas"
    );

const shapeCtx =
    shapeCanvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );

const paintCtx =
    paintCanvas.getContext(
        "2d",
        {
            willReadFrequently:true
        }
    );


/* =====================================================
   IMAGE
===================================================== */

const img =
    new Image();


/* =====================================================
   ELEMENTS
===================================================== */

const logoScreen =
    document.getElementById(
        "logo"
    );

const introScreen =
    document.getElementById(
        "intro"
    );

const gameScreen =
    document.getElementById(
        "game"
    );

const endScreen =
    document.getElementById(
        "end"
    );

const questionText =
    document.getElementById(
        "question"
    );

const scoreText =
    document.getElementById(
        "score"
    );

const messageBox =
    document.getElementById(
        "msg"
    );

const finalText =
    document.getElementById(
        "final"
    );


/* =====================================================
   LOGO
===================================================== */

logoScreen.style.display =
    "flex";


setTimeout(
    function(){

        logoScreen.style.display =
            "none";

        introScreen.style.display =
            "flex";

    },
    5000
);


/* =====================================================
   SHUFFLE
===================================================== */

function shuffleQuestions(){

    questions =
        originalQuestions.map(
            function(item){

                return [...item];

            }
        );


    for(
        let i =
            questions.length - 1;

        i > 0;

        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        [
            questions[i],
            questions[j]
        ] =
        [
            questions[j],
            questions[i]
        ];

    }

}


/* =====================================================
   START
===================================================== */

function startGame(){

    speechEnabled =
        true;


    shuffleQuestions();


    index = 0;

    score = 0;


    introScreen.style.display =
        "none";


    endScreen.style.display =
        "none";


    gameScreen.style.display =
        "flex";


    loadQuestion();

}


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion(){

    drawing = false;


    messageBox.textContent =
        "";


    const type =
        questions[index][1];


    const object =
        questions[index][2];


    currentInstruction =
        "Colour the " +
        type +
        " of the " +
        object +
        ".";


    questionText.textContent =
        currentInstruction;


    scoreText.textContent =
        score;


    drawImage();


    if(speechEnabled){

        setTimeout(
            function(){

                speakCurrentInstruction();

            },
            350
        );

    }

}


/* =====================================================
   SPEECH
===================================================== */

function speakCurrentInstruction(){

    if(
        !currentInstruction
    ){

        return;

    }


    if(
        !("speechSynthesis" in window)
    ){

        return;

    }


    window.speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            currentInstruction
        );


    speech.lang =
        "en-IN";

    speech.rate =
        0.82;

    speech.pitch =
        1.05;

    speech.volume =
        1;


    const voices =
        window.speechSynthesis.getVoices();


    const voice =
        voices.find(
            function(v){

                return (
                    v.lang ===
                    "en-IN"
                );

            }
        ) ||

        voices.find(
            function(v){

                return v.lang.startsWith(
                    "en"
                );

            }
        );


    if(voice){

        speech.voice =
            voice;

    }


    window.speechSynthesis.speak(
        speech
    );

}


/* =====================================================
   DRAW ORIGINAL IMAGE
===================================================== */

function drawImage(){

    shapeCtx.clearRect(
        0,
        0,
        shapeCanvas.width,
        shapeCanvas.height
    );


    paintCtx.clearRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );


    img.onload =
        function(){

            shapeCtx.clearRect(
                0,
                0,
                350,
                350
            );


            /*
            Draw the original object.
            */

            shapeCtx.drawImage(
                img,
                50,
                50,
                250,
                250
            );


            /*
            Make sure the painting layer
            starts completely transparent.
            */

            paintCtx.clearRect(
                0,
                0,
                350,
                350
            );

        };


    img.src =
        "assets/" +
        questions[index][0];

}


/* =====================================================
   SELECT COLOUR
===================================================== */

function chooseColour(
    colour,
    button
){

    selected =
        colour;


    document
        .querySelectorAll(
            ".colors button"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "selected-colour"
                );

            }
        );


    button.classList.add(
        "selected-colour"
    );

}


/* =====================================================
   GET CANVAS POSITION
===================================================== */

function getCanvasPosition(
    event
){

    const rect =
        paintCanvas.getBoundingClientRect();


    return {

        x:
            (
                event.clientX -
                rect.left
            ) *
            (
                paintCanvas.width /
                rect.width
            ),

        y:
            (
                event.clientY -
                rect.top
            ) *
            (
                paintCanvas.height /
                rect.height
            )

    };

}


/* =====================================================
   PAINT
===================================================== */

function paint(event){

    if(!drawing){

        return;

    }


    const position =
        getCanvasPosition(
            event
        );


    paintCtx.fillStyle =
        selected;


    paintCtx.beginPath();


    paintCtx.arc(
        position.x,
        position.y,
        17,
        0,
        Math.PI * 2
    );


    paintCtx.fill();

}


/* =====================================================
   POINTER DOWN
===================================================== */

paintCanvas.addEventListener(
    "pointerdown",
    function(event){

        event.preventDefault();


        drawing = true;


        try{

            paintCanvas.setPointerCapture(
                event.pointerId
            );

        }
        catch(error){

        }


        paint(event);

    }
);


/* =====================================================
   POINTER MOVE
===================================================== */

paintCanvas.addEventListener(
    "pointermove",
    function(event){

        event.preventDefault();

        paint(event);

    }
);


/* =====================================================
   POINTER UP
===================================================== */

paintCanvas.addEventListener(
    "pointerup",
    function(){

        drawing = false;

    }
);


paintCanvas.addEventListener(
    "pointercancel",
    function(){

        drawing = false;

    }
);


/* =====================================================
   CLEAR
===================================================== */

function clearPaint(){

    paintCtx.clearRect(
        0,
        0,
        paintCanvas.width,
        paintCanvas.height
    );


    drawing = false;


    messageBox.textContent =
        "";

}


/* =====================================================
   FIND OBJECT PIXELS
===================================================== */

function getObjectMask(){

    const original =
        shapeCtx.getImageData(
            0,
            0,
            shapeCanvas.width,
            shapeCanvas.height
        );


    return original.data;

}


/* =====================================================
   CALCULATE PAINT COVERAGE
===================================================== */

function calculatePaintCoverage(){

    const original =
        shapeCtx.getImageData(
            0,
            0,
            shapeCanvas.width,
            shapeCanvas.height
        ).data;


    const paint =
        paintCtx.getImageData(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        ).data;


    let objectPixels = 0;

    let paintedPixels = 0;


    /*
    Only pixels belonging to the
    original object are counted.
    */

    for(
        let i = 0;
        i < original.length;
        i += 4
    ){

        const originalAlpha =
            original[i + 3];


        if(
            originalAlpha > 30
        ){

            objectPixels++;


            const paintAlpha =
                paint[i + 3];


            if(
                paintAlpha > 30
            ){

                paintedPixels++;

            }

        }

    }


    if(
        objectPixels === 0
    ){

        return 0;

    }


    return (
        paintedPixels /
        objectPixels
    ) * 100;

}


/* =====================================================
   CHECK WHETHER PAINT IS INSIDE OBJECT
===================================================== */

function calculateOutsidePaint(){

    const original =
        shapeCtx.getImageData(
            0,
            0,
            shapeCanvas.width,
            shapeCanvas.height
        ).data;


    const paint =
        paintCtx.getImageData(
            0,
            0,
            paintCanvas.width,
            paintCanvas.height
        ).data;


    let paintedTotal = 0;

    let paintedOutside = 0;


    for(
        let i = 0;
        i < paint.length;
        i += 4
    ){

        const paintAlpha =
            paint[i + 3];


        if(
            paintAlpha > 30
        ){

            paintedTotal++;


            const originalAlpha =
                original[i + 3];


            if(
                originalAlpha <= 30
            ){

                paintedOutside++;

            }

        }

    }


    if(
        paintedTotal === 0
    ){

        return 100;

    }


    return (
        paintedOutside /
        paintedTotal
    ) * 100;

}


/* =====================================================
   VALIDATE ANSWER
===================================================== */

function validateAnswer(){

    const coverage =
        calculatePaintCoverage();


    const outside =
        calculateOutsidePaint();


    const requested =
        questions[index][1];


    /*
    Reject if the learner coloured
    mostly outside the object.
    */

    if(
        outside > 18
    ){

        return false;

    }


    /*
    WHOLE

    Need at least 85%.
    */

    if(
        requested ===
        "whole"
    ){

        return (
            coverage >= 85 &&
            coverage <= 100
        );

    }


    /*
    HALF

    Accept approximately 40–60%.

    This means colouring the whole
    object will NOT be accepted.
    */

    if(
        requested ===
        "half"
    ){

        return (
            coverage >= 40 &&
            coverage <= 60
        );

    }


    /*
    QUARTER

    Accept approximately 15–35%.

    This means colouring half or the
    whole object will NOT be accepted.
    */

    if(
        requested ===
        "quarter"
    ){

        return (
            coverage >= 15 &&
            coverage <= 35
        );

    }


    return false;

}


/* =====================================================
   SUBMIT ANSWER
===================================================== */

function submitAnswer(){

    window.speechSynthesis.cancel();


    const coverage =
        calculatePaintCoverage();


    /*
    No colouring.
    */

    if(
        coverage < 5
    ){

        messageBox.textContent =
            "🎨 Please colour the shape first!";


        playSound(
            document.getElementById(
                "wrong"
            )
        );


        return;

    }


    const correct =
        validateAnswer();


    if(correct){

        score++;


        scoreText.textContent =
            score;


        messageBox.textContent =
            "⭐ Great job!";


        playSound(
            document.getElementById(
                "correct"
            )
        );


        setTimeout(
            function(){

                index++;


                if(
                    index >=
                    questions.length
                ){

                    finishGame();

                }
                else{

                    loadQuestion();

                }

            },
            1100
        );

    }
    else{

        /*
        IMPORTANT:
        The answer is wrong if the
        amount coloured does not match
        whole / half / quarter.
        */

        messageBox.textContent =
            getWrongMessage(
                coverage
            );


        playSound(
            document.getElementById(
                "wrong"
            )
        );

    }

}


/* =====================================================
   WRONG ANSWER MESSAGE
===================================================== */

function getWrongMessage(
    coverage
){

    const requested =
        questions[index][1];


    if(
        requested ===
        "half"
    ){

        if(
            coverage > 60
        ){

            return "😊 That is too much. Colour only half.";

        }


        return "😊 Colour a little more to make half.";

    }


    if(
        requested ===
        "quarter"
    ){

        if(
            coverage > 35
        ){

            return "😊 That is too much. Colour only a quarter.";

        }


        return "😊 Colour a little more to make a quarter.";

    }


    if(
        requested ===
        "whole"
    ){

        return "😊 Colour the whole object.";

    }


    return "😊 Try again!";

}


/* =====================================================
   AUDIO
===================================================== */

function playSound(
    audio
){

    if(!audio){

        return;

    }


    audio.pause();

    audio.currentTime =
        0;


    const promise =
        audio.play();


    if(
        promise !== undefined
    ){

        promise.catch(
            function(){

            }
        );

    }

}


/* =====================================================
   FINISH
===================================================== */

function finishGame(){

    window.speechSynthesis.cancel();


    gameScreen.style.display =
        "none";


    endScreen.style.display =
        "flex";


    finalText.textContent =
        "⭐ Score: " +
        score +
        "/10";


    playSound(
        document.getElementById(
            "clap"
        )
    );

}


/* =====================================================
   RESTART
===================================================== */

function restartGame(){

    window.speechSynthesis.cancel();

    startGame();

}


/* =====================================================
   STOP SPEECH WHEN PAGE HIDDEN
===================================================== */

document.addEventListener(
    "visibilitychange",
    function(){

        if(
            document.hidden
        ){

            window.speechSynthesis.cancel();

        }

    }
);

</script>

<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Big or Small?</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- INNOVINE LOGO -->

<div id="splash">

    <img
        src="assets/innovine-logo.png"
        alt="Innovine Solutions">

</div>


<!-- START SCREEN -->

<div id="startScreen" class="screen">

    <div class="card">

        <div class="emoji">🌟</div>

        <h1>Big or Small?</h1>

        <p>
            Look at the two objects.
        </p>

        <p>
            <strong>Tap on the big or small object.</strong>
        </p>

        <button
            id="startBtn"
            type="button">
            ▶ Start Game
        </button>

    </div>

</div>


<!-- GAME -->

<div id="game" class="hidden">

    <header>

        <h1>Big or Small?</h1>

        <div class="topRow">

            <button
                id="hearBtn"
                type="button">
                🔊 Hear
            </button>

            <div id="progress">
                1 / 10
            </div>

            <div id="score">
                ⭐ 0
            </div>

        </div>

    </header>


    <main>

        <section class="question">

            <!-- INSTRUCTION -->

            <p id="instruction">
                Tap on the big object.
            </p>


            <!-- OBJECTS -->

            <div
                id="pair"
                class="pair">
            </div>


            <p class="hint">
                Tap on the correct object.
            </p>

        </section>


        <!-- FEEDBACK -->

        <div
            id="feedback"
            class="hidden">
        </div>


        <!-- CONFETTI -->

        <div id="confetti">
        </div>

    </main>

</div>


<!-- END SCREEN -->

<div
    id="endScreen"
    class="screen hidden">

    <div class="card">

        <div class="emoji">
            🏆
        </div>

        <h1>
            Great Job!
        </h1>

        <p id="finalScore">
        </p>

        <p>
            🎉 You know big and small!
        </p>

        <button
            id="againBtn"
            type="button">
            🔄 Play Again
        </button>

    </div>

</div>


<!-- AUDIO -->

<audio
    id="music"
    loop
    preload="auto">

    <source
        src="assets/background-music.mp3"
        type="audio/mpeg">

</audio>


<audio
    id="correctSound"
    preload="auto">

    <source
        src="assets/correct.mp3"
        type="audio/mpeg">

</audio>


<audio
    id="wrongSound"
    preload="auto">

    <source
        src="assets/wrong.mp3"
        type="audio/mpeg">

</audio>


<!-- SPEECH -->

<script src="speech.js"></script>

<!-- GAME SCRIPT -->

<script src="script.js"></script>

</body>

</html>

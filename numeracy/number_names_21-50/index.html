<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Number Names 21-50</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, sans-serif;
}

body{
  background:linear-gradient(180deg,#a9d6f5 0%,#f7e8b5 48%,#f8b4d9 100%);
}

.screen{
  width:100vw;
  height:100svh;
  overflow:hidden;
}

#logoScreen{
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

#logoScreen img{
  width:min(55vw,260px);
  height:auto;
}

#gameScreen{
  display:none;
  height:100svh;
  padding:1vh 2vw;
  grid-template-rows:auto auto 1fr auto;
  gap:0.8vh;
}

.header{
  height:8vh;
  min-height:44px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.title{
  font-size:clamp(22px,5vw,46px);
  font-weight:900;
  color:#ff6b35;
  text-shadow:2px 2px white;
}

.score{
  background:white;
  padding:7px 12px;
  border-radius:18px;
  font-size:clamp(14px,3vw,22px);
  font-weight:900;
  color:#ff9000;
  box-shadow:0 3px 8px rgba(0,0,0,0.16);
}

.instruction{
  justify-self:center;
  background:white;
  padding:7px 16px;
  border-radius:24px;
  font-size:clamp(12px,2.7vw,19px);
  font-weight:800;
  color:#5d4639;
  text-align:center;
  max-width:94vw;
  box-shadow:0 3px 8px rgba(0,0,0,0.12);
}

.main{
  min-height:0;
  background:rgba(255,255,255,0.58);
  border-radius:28px;
  padding:1.5vh 2vw;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:space-evenly;
  overflow:hidden;
}

.number-card{
  width:min(48vw,230px);
  height:min(22vh,130px);
  background:white;
  border:5px solid #ffb347;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(54px,13vw,110px);
  font-weight:900;
  color:#5b8cff;
  text-shadow:3px 3px #eaf1ff;
  animation:flash 1s infinite alternate;
}

@keyframes flash{
  from{transform:scale(1); box-shadow:0 0 8px rgba(255,179,71,0.4);}
  to{transform:scale(1.05); box-shadow:0 0 22px rgba(255,179,71,0.9);}
}

.blank-row{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:6px;
  flex-wrap:wrap;
  max-width:96vw;
}

.blank{
  width:clamp(28px,6vw,52px);
  height:clamp(34px,7vh,58px);
  background:white;
  border-bottom:5px solid #ff7048;
  border-radius:10px 10px 4px 4px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(18px,4vw,34px);
  font-weight:900;
  color:#333;
}

.space{
  width:clamp(12px,3vw,26px);
  height:clamp(34px,7vh,58px);
}

.letters{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  max-width:96vw;
}

.letter{
  width:clamp(36px,7vw,62px);
  height:clamp(36px,7vw,62px);
  border:none;
  border-radius:16px;
  background:white;
  border:3px solid #ffa83b;
  font-size:clamp(19px,4vw,34px);
  font-weight:900;
  color:#333;
  box-shadow:0 3px 8px rgba(0,0,0,0.16);
  cursor:pointer;
}

.letter:active{
  transform:scale(0.92);
}

.letter.used{
  opacity:0.25;
  pointer-events:none;
}

.message{
  height:5vh;
  min-height:25px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(14px,3vw,22px);
  font-weight:900;
  color:#177f3d;
}

#endScreen{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.95);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:20;
}

.end-card{
  background:white;
  border-radius:28px;
  padding:30px;
  text-align:center;
  box-shadow:0 6px 18px rgba(0,0,0,0.22);
  z-index:30;
}

.end-card h2{
  font-size:clamp(30px,7vw,54px);
  color:#ff7048;
  margin-bottom:14px;
}

.end-card p{
  font-size:clamp(18px,4vw,28px);
  font-weight:800;
  color:#444;
}

.end-card button{
  margin-top:20px;
  padding:14px 26px;
  border:none;
  border-radius:18px;
  background:#ffb347;
  color:white;
  font-size:20px;
  font-weight:900;
}

.confetti{
  position:fixed;
  top:-20px;
  width:10px;
  height:16px;
  z-index:25;
  animation:fall 3s linear forwards;
}

@keyframes fall{
  0%{transform:translateY(-20px) rotate(0deg);opacity:1;}
  100%{transform:translateY(110vh) rotate(720deg);opacity:0;}
}

@media(max-width:700px){
  #gameScreen{
    padding:0.8vh 2vw;
    gap:0.5vh;
  }

  .header{
    height:7vh;
    min-height:40px;
  }

  .title{
    font-size:clamp(20px,6.5vw,32px);
  }

  .score{
    font-size:14px;
    padding:7px 9px;
  }

  .instruction{
    font-size:clamp(12px,3vw,15px);
    padding:7px 12px;
  }

  .main{
    border-radius:22px;
    padding:1vh 1.5vw;
  }

  .number-card{
    width:min(56vw,200px);
    height:min(17vh,105px);
    font-size:clamp(50px,16vw,84px);
  }

  .blank-row{
    gap:4px;
  }

  .blank{
    width:clamp(25px,7vw,38px);
    height:clamp(32px,6vh,46px);
    font-size:clamp(17px,5vw,25px);
  }

  .letters{
    gap:6px;
  }

  .letter{
    width:clamp(34px,9vw,48px);
    height:clamp(34px,9vw,48px);
    font-size:clamp(18px,5vw,26px);
    border-radius:13px;
  }

  .message{
    font-size:14px;
  }
}

@media(max-height:680px){
  .number-card{
    height:90px;
    font-size:58px;
  }

  .blank{
    height:34px;
    font-size:18px;
  }

  .letter{
    width:34px;
    height:34px;
    font-size:18px;
  }

  .instruction{
    font-size:12px;
    padding:6px 10px;
  }

  .message{
    min-height:20px;
    font-size:13px;
  }
}
</style>
</head>

<body>

<audio id="correctSound" src="assets/correct.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>
<audio id="clapSound" src="assets/freesound_community-claps-44774.mp3" preload="auto"></audio>

<div id="logoScreen" class="screen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<div id="gameScreen" class="screen">

  <div class="header">
    <div class="title">Number Names</div>
    <div class="score">⭐ <span id="score">0</span>/15</div>
  </div>

  <div class="instruction">
    Look at the number and tap the letters in order to complete the number name.
  </div>

  <div class="main">
    <div class="number-card" id="numberBox">21</div>
    <div class="blank-row" id="blankRow"></div>
    <div class="letters" id="lettersBox"></div>
  </div>

  <div class="message" id="message">Tap the letters to spell the number name.</div>

</div>

<div id="endScreen">
  <div class="end-card">
    <h2>🎉 Excellent!</h2>
    <p>You completed all number names!</p>
    <button onclick="location.reload()">Play Again</button>
  </div>
</div>

<script>
const allQuestions = [
  {num:21,name:"Twenty One"},
  {num:22,name:"Twenty Two"},
  {num:23,name:"Twenty Three"},
  {num:24,name:"Twenty Four"},
  {num:25,name:"Twenty Five"},
  {num:26,name:"Twenty Six"},
  {num:27,name:"Twenty Seven"},
  {num:28,name:"Twenty Eight"},
  {num:29,name:"Twenty Nine"},
  {num:30,name:"Thirty"},
  {num:31,name:"Thirty One"},
  {num:32,name:"Thirty Two"},
  {num:33,name:"Thirty Three"},
  {num:34,name:"Thirty Four"},
  {num:35,name:"Thirty Five"},
  {num:36,name:"Thirty Six"},
  {num:37,name:"Thirty Seven"},
  {num:38,name:"Thirty Eight"},
  {num:39,name:"Thirty Nine"},
  {num:40,name:"Forty"},
  {num:41,name:"Forty One"},
  {num:42,name:"Forty Two"},
  {num:43,name:"Forty Three"},
  {num:44,name:"Forty Four"},
  {num:45,name:"Forty Five"},
  {num:46,name:"Forty Six"},
  {num:47,name:"Forty Seven"},
  {num:48,name:"Forty Eight"},
  {num:49,name:"Forty Nine"},
  {num:50,name:"Fifty"}
];

let questions = shuffle([...allQuestions]).slice(0,15);
let currentIndex = 0;
let score = 0;
let selectedLetters = [];
let usedButtons = [];
let audioUnlocked = false;

const numberBox = document.getElementById("numberBox");
const blankRow = document.getElementById("blankRow");
const lettersBox = document.getElementById("lettersBox");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

const correctSound = document.getElementById("correctSound");
const wrongSound = document.getElementById("wrongSound");
const clapSound = document.getElementById("clapSound");

function unlockAudio(){
  if(audioUnlocked) return;

  [correctSound, wrongSound, clapSound].forEach(sound=>{
    sound.volume = 0.01;
    sound.play().then(()=>{
      sound.pause();
      sound.currentTime = 0;
      sound.volume = 1;
    }).catch(()=>{});
  });

  audioUnlocked = true;
}

document.addEventListener("click", unlockAudio, {once:true});
document.addEventListener("touchstart", unlockAudio, {once:true});

function playSound(sound){
  try{
    sound.pause();
    sound.currentTime = 0;
    sound.volume = 1;
    sound.play().catch(()=>{});
  }catch(e){}
}

function shuffle(array){
  for(let i=array.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i+1));
    [array[i],array[j]] = [array[j],array[i]];
  }
  return array;
}

function normalize(text){
  return text.replace(/\s+/g,"").toUpperCase();
}

function loadQuestion(){
  if(currentIndex >= questions.length){
    finishGame();
    return;
  }

  selectedLetters = [];
  usedButtons = [];

  const current = questions[currentIndex];
  numberBox.textContent = current.num;
  blankRow.innerHTML = "";
  lettersBox.innerHTML = "";
  message.textContent = "Tap the letters to spell the number name.";

  const displayName = current.name.toUpperCase();

  for(let i=0;i<displayName.length;i++){
    if(displayName[i] === " "){
      const space = document.createElement("div");
      space.className = "space";
      blankRow.appendChild(space);
    }else{
      const blank = document.createElement("div");
      blank.className = "blank";
      blankRow.appendChild(blank);
    }
  }

  const letters = normalize(current.name).split("");
  const shuffledLetters = shuffle([...letters]);

  shuffledLetters.forEach(letter=>{
    const btn = document.createElement("button");
    btn.className = "letter";
    btn.textContent = letter;

    btn.addEventListener("click",()=>{
      unlockAudio();

      if(btn.classList.contains("used")) return;

      const blanks = document.querySelectorAll(".blank");
      if(selectedLetters.length >= blanks.length) return;

      selectedLetters.push(letter);
      usedButtons.push(btn);

      blanks[selectedLetters.length - 1].textContent = letter;
      btn.classList.add("used");

      checkAnswer();
    });

    lettersBox.appendChild(btn);
  });
}

function clearAnswer(){
  selectedLetters = [];
  usedButtons.forEach(btn=>btn.classList.remove("used"));
  usedButtons = [];

  document.querySelectorAll(".blank").forEach(blank=>{
    blank.textContent = "";
  });
}

function checkAnswer(){
  const current = questions[currentIndex];
  const correctAnswer = normalize(current.name);
  const learnerAnswer = selectedLetters.join("");

  if(learnerAnswer.length < correctAnswer.length){
    return;
  }

  if(learnerAnswer === correctAnswer){
    playSound(correctSound);
    score++;
    scoreText.textContent = score;
    message.textContent = "Good job!";
    currentIndex++;

    setTimeout(loadQuestion,800);
  }else{
    playSound(wrongSound);
    message.textContent = "Oops! Try again.";
    setTimeout(clearAnswer,700);
  }
}

function createConfetti(){
  const colors = ["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93","#ff8fab"];

  for(let i=0;i<90;i++){
    const piece = document.createElement("div");
    piece.className = "confetti";
    piece.style.left = Math.random() * 100 + "vw";
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 1.5 + "s";
    piece.style.animationDuration = (2.5 + Math.random() * 1.8) + "s";
    document.body.appendChild(piece);

    setTimeout(()=>piece.remove(),5000);
  }
}

function finishGame(){
  playSound(clapSound);
  document.getElementById("endScreen").style.display = "flex";
  createConfetti();
}

setTimeout(()=>{
  document.getElementById("logoScreen").style.display = "none";
  document.getElementById("gameScreen").style.display = "grid";
  loadQuestion();
},2000);
</script>

</body>
</html>

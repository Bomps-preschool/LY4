<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shape - Pyramid</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff7df;
  user-select:none;
}

.screen{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  display:none;
  align-items:center;
  justify-content:center;
  text-align:center;
  overflow:hidden;
}

/* LOGO SCREEN */
#splash{
  display:flex;
  background:#ffffff;
  z-index:10;
}

#splash img{
  width:170px;
  max-width:60vw;
  height:auto;
}

/* START SCREEN */
#startScreen{
  background:linear-gradient(180deg,#fff7df,#ffe2a8);
  padding:20px;
}

.start-card{
  width:90%;
  max-width:560px;
  background:#ffffff;
  border-radius:28px;
  padding:28px 18px;
  box-shadow:0 8px 22px rgba(0,0,0,0.16);
  border:5px solid #ffd36a;
}

.start-card h1{
  margin:0 0 14px;
  font-size:clamp(30px,7vw,48px);
  color:#d97706;
}

.start-card p{
  font-size:clamp(24px,6vw,36px);
  font-weight:bold;
  color:#1f2937;
  margin:12px 0 22px;
}

button{
  border:0;
  border-radius:999px;
  padding:15px 38px;
  font-size:clamp(20px,5vw,28px);
  font-weight:bold;
  color:white;
  background:#22c55e;
  box-shadow:0 6px 0 #15803d;
  cursor:pointer;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 #15803d;
}

/* GAME SCREEN */
#gameScreen{
  background:linear-gradient(180deg,#e0f7ff,#fff7df);
  flex-direction:column;
  justify-content:flex-start;
  padding:10px;
}

.top-bar{
  width:100%;
  max-width:950px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:8px 8px 4px;
}

.badge{
  background:#ffffff;
  color:#374151;
  border-radius:18px;
  padding:8px 14px;
  font-size:clamp(15px,3vw,20px);
  font-weight:bold;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.instruction{
  width:100%;
  max-width:950px;
  background:#ffffff;
  color:#e6cb1c;
  border-radius:18px;
  padding:10px;
  margin:4px 0 8px;
  font-size:clamp(24px,6vw,38px);
  font-weight:900;
  box-shadow:0 3px 10px rgba(0,0,0,0.12);
}

.options{
  width:100%;
  max-width:950px;
  flex:1;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  align-items:center;
  justify-content:center;
  padding:8px;
}

.option{
  position:relative;
  width:100%;
  height:min(48vh,360px);
  background:#ffffff;
  border:5px solid #ffd36a;
  border-radius:28px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  box-shadow:0 8px 18px rgba(0,0,0,0.15);
  transition:transform 0.15s ease;
}

.option img{
  max-width:88%;
  max-height:88%;
  object-fit:contain;
  pointer-events:none;
}

.option:active{
  transform:scale(0.96);
}

.option.locked{
  pointer-events:none;
}

.wiggle{
  animation:wiggle 0.38s ease;
}

@keyframes wiggle{
  0%{transform:translateX(0);}
  20%{transform:translateX(-10px);}
  40%{transform:translateX(10px);}
  60%{transform:translateX(-8px);}
  80%{transform:translateX(8px);}
  100%{transform:translateX(0);}
}

.glow{
  animation:glow 0.8s infinite alternate;
  border-color:#22c55e;
}

@keyframes glow{
  from{
    box-shadow:0 0 10px #22c55e,0 8px 18px rgba(0,0,0,0.15);
  }
  to{
    box-shadow:0 0 28px #22c55e,0 8px 18px rgba(0,0,0,0.15);
  }
}

.feedback{
  position:absolute;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background:rgba(255,255,255,0.88);
  border-radius:22px;
  z-index:5;
}

.tick{
  width:85px;
  height:85px;
  border-radius:50%;
  background:#22c55e;
  color:white;
  font-size:62px;
  font-weight:bold;
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:10px;
}

.goodjob{
  color:#15803d;
  font-size:clamp(24px,5vw,38px);
  font-weight:900;
}

/* END SCREEN */
#endScreen{
  background:linear-gradient(180deg,#fff7df,#d9f99d);
  padding:20px;
}

.end-card{
  width:90%;
  max-width:580px;
  background:#ffffff;
  border-radius:32px;
  padding:30px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,0.18);
  border:5px solid #86efac;
  z-index:3;
}

.end-card h2{
  font-size:clamp(38px,9vw,64px);
  color:#16a34a;
  margin:0 0 14px;
}

.end-card p{
  font-size:clamp(20px,5vw,30px);
  font-weight:bold;
  color:#374151;
  margin:10px 0 22px;
}

#confettiCanvas{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index:2;
}

/* MOBILE PORTRAIT */
@media(max-width:700px){
  #gameScreen{
    padding:8px;
  }

  .top-bar{
    padding:4px;
  }

  .instruction{
    margin:4px 0;
    padding:8px;
  }

  .options{
    grid-template-columns:1fr;
    gap:8px;
    padding:4px;
  }

  .option{
    height:calc((100vh - 170px) / 3);
    min-height:120px;
    border-radius:22px;
  }

  .option img{
    max-width:72%;
    max-height:82%;
  }

  .tick{
    width:62px;
    height:62px;
    font-size:44px;
  }
}

/* SMALL HEIGHT DEVICES */
@media(max-height:520px){
  .options{
    grid-template-columns:repeat(3,1fr);
    gap:8px;
  }

  .option{
    height:48vh;
  }

  .instruction{
    font-size:24px;
    padding:6px;
  }

  .badge{
    font-size:14px;
    padding:6px 10px;
  }
}
</style>
</head>

<body>

<!-- SPLASH SCREEN -->
<div id="splash" class="screen">
  <img src="assets/innovine-logo.png" alt="Innovine Logo">
</div>

<!-- START SCREEN -->
<div id="startScreen" class="screen">
  <div class="start-card">
    <h1>Shape - Pyramid</h1>
    <p>Tap on Pyramid</p>
    <button onclick="startGame()">Start</button>
  </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen" class="screen">
  <div class="top-bar">
    <div class="badge" id="questionCounter">1 / 6</div>
    <div class="badge" id="tryCounter">Try: 1</div>
  </div>

  <div class="instruction">Tap on Pyramid</div>

  <div class="options" id="optionsBox"></div>
</div>

<!-- END SCREEN -->
<div id="endScreen" class="screen">
  <canvas id="confettiCanvas"></canvas>
  <div class="end-card">
    <h2>Good Job!</h2>
    <p>You found all the pyramids.</p>
    <button onclick="restartGame()">Play Again</button>
  </div>
</div>

<audio id="clapSound" src="assets/claps.mp3" preload="auto"></audio>
<audio id="wrongSound" src="assets/wrong.mp3" preload="auto"></audio>

<script>
const splash = document.getElementById("splash");
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const endScreen = document.getElementById("endScreen");
const optionsBox = document.getElementById("optionsBox");
const questionCounter = document.getElementById("questionCounter");
const tryCounter = document.getElementById("tryCounter");

const clapSound = document.getElementById("clapSound");
const wrongSound = document.getElementById("wrongSound");

let questions = [];
let currentIndex = 0;
let wrongAttempts = 0;
let isAnswered = false;

const totalQuestions = 6;

window.onload = function(){
  splash.style.display = "flex";

  setTimeout(function(){
    splash.style.display = "none";
    startScreen.style.display = "flex";
  }, 2000);
};

function startGame(){
  unlockAudio();
  startScreen.style.display = "none";
  endScreen.style.display = "none";
  gameScreen.style.display = "flex";

  questions = createQuestions();
  currentIndex = 0;
  loadQuestion();
}

function restartGame(){
  stopConfetti();
  endScreen.style.display = "none";
  startGame();
}

function unlockAudio(){
  clapSound.volume = 1;
  wrongSound.volume = 1;

  clapSound.play().then(function(){
    clapSound.pause();
    clapSound.currentTime = 0;
  }).catch(function(){});

  wrongSound.play().then(function(){
    wrongSound.pause();
    wrongSound.currentTime = 0;
  }).catch(function(){});
}

function createQuestions(){
  let list = [];

  for(let i = 1; i <= totalQuestions; i++){
    list.push({
      id:i,
      options:[
        {type:"cube", src:"assets/cube" + i + ".png"},
        {type:"pyramid", src:"assets/pyramid" + i + ".png"},
        {type:"sphere", src:"assets/sphere" + i + ".png"}
      ]
    });
  }

  return shuffleArray(list);
}

function loadQuestion(){
  isAnswered = false;
  wrongAttempts = 0;

  questionCounter.textContent = (currentIndex + 1) + " / " + totalQuestions;
  tryCounter.textContent = "Try: 1";
  optionsBox.innerHTML = "";

  let q = questions[currentIndex];
  let shuffledOptions = shuffleArray(q.options.slice());

  shuffledOptions.forEach(function(item){
    const card = document.createElement("div");
    card.className = "option";
    card.dataset.type = item.type;

    const img = document.createElement("img");
    img.src = item.src;
    img.alt = item.type;

    const feedback = document.createElement("div");
    feedback.className = "feedback";
    feedback.innerHTML = '<div class="tick">✓</div><div class="goodjob">Good Job!</div>';

    card.appendChild(img);
    card.appendChild(feedback);

    card.addEventListener("click", function(){
      checkAnswer(card);
    });

    optionsBox.appendChild(card);
  });
}

function checkAnswer(card){
  if(isAnswered) return;

  const selectedType = card.dataset.type;

  if(selectedType === "pyramid"){
    correctAnswer(card);
  }else{
    wrongAnswer(card);
  }
}

function correctAnswer(card){
  isAnswered = true;

  const allCards = document.querySelectorAll(".option");
  allCards.forEach(function(c){
    c.classList.add("locked");
    c.classList.remove("glow");
  });

  const feedback = card.querySelector(".feedback");
  feedback.style.display = "flex";

  playSound(clapSound);

  setTimeout(function(){
    currentIndex++;

    if(currentIndex < totalQuestions){
      loadQuestion();
    }else{
      showEndScreen();
    }
  }, 1400);
}

function wrongAnswer(card){
  wrongAttempts++;

  card.classList.add("wiggle");
  playSound(wrongSound);

  setTimeout(function(){
    card.classList.remove("wiggle");
  }, 400);

  if(wrongAttempts === 1){
    tryCounter.textContent = "Try: 2";
  }

  if(wrongAttempts >= 2){
    tryCounter.textContent = "Look!";
    glowCorrectAnswer();
  }
}

function glowCorrectAnswer(){
  const allCards = document.querySelectorAll(".option");

  allCards.forEach(function(card){
    if(card.dataset.type === "pyramid"){
      card.classList.add("glow");
    }
  });
}

function showEndScreen(){
  gameScreen.style.display = "none";
  endScreen.style.display = "flex";
  playSound(clapSound);
  startConfetti();
}

function playSound(audio){
  try{
    audio.pause();
    audio.currentTime = 0;
    audio.play().catch(function(){});
  }catch(e){}
}

function shuffleArray(array){
  for(let i = array.length - 1; i > 0; i--){
    let j = Math.floor(Math.random() * (i + 1));
    let temp = array[i];
    array[i] = array[j];
    array[j] = temp;
  }
  return array;
}

/* CONFETTI */
const canvas = document.getElementById("confettiCanvas");
const ctx = canvas.getContext("2d");
let confettiPieces = [];
let confettiAnimation;

function resizeCanvas(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeCanvas);

function startConfetti(){
  resizeCanvas();
  confettiPieces = [];

  for(let i = 0; i < 120; i++){
    confettiPieces.push({
      x:Math.random() * canvas.width,
      y:Math.random() * canvas.height - canvas.height,
      size:Math.random() * 8 + 5,
      speed:Math.random() * 3 + 2,
      angle:Math.random() * 360,
      spin:Math.random() * 8 + 2,
      color:["#ef4444","#22c55e","#3b82f6","#facc15","#a855f7","#fb923c"][Math.floor(Math.random()*6)]
    });
  }

  animateConfetti();
}

function animateConfetti(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  confettiPieces.forEach(function(p){
    p.y += p.speed;
    p.angle += p.spin;

    if(p.y > canvas.height){
      p.y = -10;
      p.x = Math.random() * canvas.width;
    }

    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.angle * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
    ctx.restore();
  });

  confettiAnimation = requestAnimationFrame(animateConfetti);
}

function stopConfetti(){
  cancelAnimationFrame(confettiAnimation);
  ctx.clearRect(0,0,canvas.width,canvas.height);
}
</script>

</body>
</html>

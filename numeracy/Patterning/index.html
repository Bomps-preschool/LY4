<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>Patterning</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">  

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

body{

font-family:Arial,Helvetica,sans-serif;
overflow:auto;
touch-action:none;

background:
linear-gradient(#bfe8ff,#dff6ff 55%,#b8ecb8 55%,#8ed48e);

}

/*==========================
SPLASH
==========================*/

#splash{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;

background:white;

display:flex;
justify-content:center;
align-items:center;

z-index:9999;

}

#splash img{

width:min(75vw,360px);

}

/*==========================
TITLE SCREEN
==========================*/

#titleScreen{

position:fixed;
left:0;
top:0;
width:100%;
height:100%;

display:none;

background:

linear-gradient(#bfe8ff,#dff6ff 55%,#b8ecb8 55%,#8ed48e);

overflow:hidden;

}

/* clouds */

.cloud{

position:absolute;
background:white;
border-radius:50px;

opacity:.9;

}

.cloud:before,
.cloud:after{

content:"";
position:absolute;
background:white;
border-radius:50%;

}

.cloud1{

width:140px;
height:45px;

left:8%;
top:12%;

}

.cloud1:before{

width:55px;
height:55px;

left:20px;
top:-25px;

}

.cloud1:after{

width:65px;
height:65px;

right:18px;
top:-30px;

}

.cloud2{

width:170px;
height:50px;

right:8%;
top:18%;

}

.cloud2:before{

width:65px;
height:65px;

left:30px;
top:-30px;

}

.cloud2:after{

width:70px;
height:70px;

right:22px;
top:-35px;

}

/* title card */

#titleCard{

position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%);

background:none;
box-shadow:none;
border:none;

width:100%;
text-align:center;

}

#titleCard h1{

font-family:'Baloo 2',cursive;

font-size:clamp(60px,8vw,95px);

background:linear-gradient(
90deg,
#ff5252,
#ff9800,
#ffd600,
#4caf50,
#2196f3,
#9c27b0
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

text-shadow:3px 3px 6px rgba(0,0,0,.15);

margin-bottom:35px;

}

#titleCard p{

font-size:clamp(18px,3vw,24px);

color:#555;

margin-bottom:35px;

line-height:1.5;

}

#playBtn{

border:none;

background:#ff9800;

color:white;

font-size:34px;

padding:22px 70px;

border-radius:70px;

cursor:pointer;

font-weight:bold;

box-shadow:0 10px 20px rgba(0,0,0,.2);

animation:bounce 1s infinite;

}
@keyframes bounce{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-12px);
}

}  

#playBtn:active{

transform:scale(.95);

}

/*==========================
GAME
==========================*/

#game{

display:none;

position:fixed;
left:0;
top:0;
width:100%;
height:100%;

background:

linear-gradient(#bfe8ff,#dff6ff 55%,#b8ecb8 55%,#8ed48e);

overflow:hidden;

}

/* GAME HEADER */

#header{

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

padding-top:18px;

text-align:center;

}

#header h1{

font-family:'Baloo 2',cursive;

font-size:clamp(40px,6vw,60px);

background:linear-gradient(
90deg,
#ff5722,
#ff9800,
#ffeb3b
);

-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

}

#instruction{

font-size:28px;

font-weight:bold;

color:#37474f;

display:flex;

justify-content:center;

align-items:center;

gap:12px;

margin-top:10px;

}


/*==========================
CARD
==========================*/

#gameCard{

width:min(96vw,950px);

margin:auto;

margin-top:12px;

background:linear-gradient(
180deg,
#ffffff,
#fff9f2,
#fff6d6
);

border-radius:22px;

box-shadow:0 8px 18px rgba(0,0,0,.18);

padding:18px;

display:flex;

flex-direction:column;

align-items:center;

gap:18px;

}

/*==========================
PATTERN
==========================*/

#patternRow{

display:flex;

justify-content:center;

align-items:center;

gap:8px;

width:100%;

overflow:hidden;

}

.patternBox{

aspect-ratio:1;

border:4px solid #7ec8ff;

background:white;

display:flex;
align-items:center;
justify-content:center;

}
.dropZone{

border:5px dashed #ff9800;

background:#fff3b5;

animation:pulse 1s infinite;

}
@keyframes pulse{

0%{
transform:scale(1);
}

50%{
transform:scale(1.05);
}

100%{
transform:scale(1);
}

}  
/*==========================
OPTIONS
==========================*/

#optionsRow{

display:flex;

justify-content:center;

gap:18px;

margin-top:12px;

}

.option{

aspect-ratio:1;

background:linear-gradient(
180deg,
#7bb8ff,
#5c95ff
);

border:3px solid white;

border-radius:20px;

display:flex;
align-items:center;
justify-content:center;

box-shadow:0 6px 12px rgba(0,0,0,.15);

touch-action:none;

}
.option:hover{

transform:scale(1.08);

cursor:pointer;

}
/* image */

.patternImg,
.optionImg{

width:88%;
height:88%;

object-fit:contain;

pointer-events:none;

}

/*==========================
MESSAGE
==========================*/

#message{

height:40px;

font-size:28px;

font-weight:bold;

color:#2e7d32;

margin-top:15px;

}
#speakBtn{

margin-left:12px;

width:60px;
height:60px;

border:none;

border-radius:50%;

background:#4CAF50;

color:white;

font-size:30px;

cursor:pointer;

box-shadow:0 5px 12px rgba(0,0,0,.2);

transition:.2s;

}

#speakBtn:hover{

transform:scale(1.08);

background:#43a047;

}  

/*==========================
FINISH
==========================*/

#finish{

display:none;

position:fixed;

left:0;
top:0;

width:100%;
height:100%;

background:

linear-gradient(#bfe8ff,#dff6ff 55%,#b8ecb8 55%,#8ed48e);

justify-content:center;
align-items:center;

flex-direction:column;

}

#finishCard{

background:white;

padding:35px;

border-radius:30px;

box-shadow:0 10px 20px rgba(0,0,0,.18);

width:min(90vw,500px);

}

#finish h1{

font-size:54px;

color:#ff6b2d;

margin-bottom:18px;

}

#finish p{

font-size:24px;

margin-bottom:30px;

}

#playAgain{

padding:18px 45px;

border:none;

border-radius:50px;

background:#ff9800;

color:white;

font-size:28px;

font-weight:bold;

cursor:pointer;

box-shadow:0 8px 18px rgba(0,0,0,.2);

transition:.2s;

}

#playAgain:hover{

transform:scale(1.05);

background:#fb8c00;

}

/*==========================
CONFETTI
==========================*/

.confetti{

position:fixed;

width:12px;
height:12px;

top:-20px;

z-index:5000;

}
@keyframes fall{

from{

transform:translateY(-20px) rotate(0deg);

}

to{

transform:translateY(110vh) rotate(720deg);

}

}  

/*==========================
RESPONSIVE
==========================*/

@media (max-width:700px){

.patternBox{

width:11vw;
height:11vw;

min-width:42px;
min-height:42px;

max-width:58px;
max-height:58px;

}

#patternRow{

gap:5px;

}

.option{

width:30vw;
height:30vw;

max-width:110px;
max-height:110px;

}

}

@media (min-width:701px){

.patternBox{

width:82px;
height:82px;

}

.option{

width:110px;
height:110px;

}

}

</style>

</head>

<body>

<!-- SPLASH -->

<div id="splash">

<img src="assets/innovine-logo.png">

</div>

<!-- TITLE -->

<div id="titleScreen">

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div id="titleCard">

<h1>Patterning</h1>


<button id="playBtn">
▶ PLAY GAME
</button>

</div>

</div>

<!-- GAME -->

<div id="game">

<div id="header">

<h1>Patterning</h1>

<div id="instruction">

Drag the correct object into the empty box to complete the pattern.

<button id="speakBtn">🔈</button>

</div>

</div>

<div id="gameCard">

<div id="patternRow"></div>

<div id="optionsRow"></div>

<div id="message"></div>

</div>

</div>

<!-- FINISH -->

<div id="finish">

<div id="finishCard">

<h1>🎉 Great Job!</h1>

<button id="playAgain">
▶ PLAY AGAIN
</button>

</div>

</div>


<!-- AUDIO -->

<audio id="correctSound" src="assets/correct.mp3"></audio>

<audio id="wrongSound" src="assets/wrong.mp3"></audio>

<audio id="finishSound"
src="assets/freesound_community-claps-44774.mp3"></audio>

<script>

const rounds=[

{
pattern:"AABB",
sequence:[
"assets/apple.png",
"assets/apple.png",
"assets/ball.png",
"assets/ball.png",
"assets/apple.png",
"assets/apple.png",
null
],
correct:"assets/ball.png",
options:[
"assets/ball.png",
"assets/apple.png"
]
},

{
pattern:"AB",
sequence:[
"assets/marble.png",
"assets/banana.png",
"assets/marble.png",
"assets/banana.png",
null
],
correct:"assets/marble.png",
options:[
"assets/marble.png",
"assets/banana.png"
]
},

{
pattern:"AAB",
sequence:[
"assets/puppy.png",
"assets/puppy.png",
"assets/cat.png",
"assets/puppy.png",
"assets/puppy.png",
null
],
correct:"assets/cat.png",
options:[
"assets/cat.png",
"assets/puppy.png"
]
},

{
pattern:"ABC",
sequence:[
"assets/bird.png",
"assets/turtle.png",
"assets/bunny.png",
"assets/bird.png",
"assets/turtle.png",
null
],
correct:"assets/bunny.png",
options:[
"assets/bunny.png",
"assets/turtle.png"
]
},

{
pattern:"ABB",
sequence:[
"assets/book.png",
"assets/car.png",
"assets/car.png",
"assets/book.png",
"assets/car.png",
null
],
correct:"assets/car.png",
options:[
"assets/car.png",
"assets/book.png"
]
},

{
pattern:"AB",
sequence:[
"assets/turtle.png",
"assets/bunny.png",
"assets/turtle.png",
"assets/bunny.png",
null
],
correct:"assets/turtle.png",
options:[
"assets/turtle.png",
"assets/bunny.png"
]
},

{
pattern:"ABC",
sequence:[
"assets/apple.png",
"assets/banana.png",
"assets/orange.png",
"assets/apple.png",
"assets/banana.png",
null
],
correct:"assets/orange.png",
options:[
"assets/orange.png",
"assets/banana.png"
]
},

{
pattern:"AAB",
sequence:[
"assets/ball.png",
"assets/ball.png",
"assets/marble.png",
"assets/ball.png",
"assets/ball.png",
null
],
correct:"assets/marble.png",
options:[
"assets/marble.png",
"assets/ball.png"
]
},

{
pattern:"AABB",
sequence:[
"assets/cat.png",
"assets/cat.png",
"assets/turtle.png",
"assets/turtle.png",
"assets/cat.png",
"assets/cat.png",
null
],
correct:"assets/turtle.png",
options:[
"assets/turtle.png",
"assets/cat.png"
]
},

{
pattern:"ABB",
sequence:[
"assets/bottle.png",
"assets/schoolbag.png",
"assets/schoolbag.png",
"assets/bottle.png",
"assets/schoolbag.png",
null
],
correct:"assets/schoolbag.png",
options:[
"assets/schoolbag.png",
"assets/bottle.png"
]
}

];

let currentRound=0;
let selectedAnswer="";
let dragClone=null;

/*************************************************
SPLASH
**************************************************/

window.onload=()=>{

setTimeout(()=>{

document.getElementById("splash").style.display="none";

document.getElementById("titleScreen").style.display="block";

},5000);

};

/*************************************************
PLAY BUTTON
**************************************************/

document
.getElementById("playBtn")
.addEventListener("click",()=>{

document.getElementById("titleScreen").style.display="none";

document.getElementById("game").style.display="block";

loadRound();

});

/*************************************************
LOAD ROUND
**************************************************/
function loadRound(){

document.getElementById("message").innerHTML="";

const round=rounds[currentRound];

buildPattern(round);

buildOptions(round);

speakQuestion();

}

function speakQuestion(){

speechSynthesis.cancel();

const speech=new SpeechSynthesisUtterance(
"Drag the correct object into the empty box to complete the pattern."
);

speech.rate=0.9;
speech.pitch=1;

speechSynthesis.speak(speech);

}

const speakBtn=document.getElementById("speakBtn");

if(speakBtn){

speakBtn.onclick=speakQuestion;

}
  

/*************************************************
BUILD PATTERN
**************************************************/

function buildPattern(round){

const row=document.getElementById("patternRow");

row.innerHTML="";

round.sequence.forEach(item=>{

const box=document.createElement("div");

box.className="patternBox";

if(item===null){

box.classList.add("dropZone");

box.dataset.answer=round.correct;

}else{

const img=document.createElement("img");

img.src=item;

img.className="patternImg";

box.appendChild(img);

}

row.appendChild(box);

});

}

/*************************************************
BUILD OPTIONS
**************************************************/

function buildOptions(round){

const row=document.getElementById("optionsRow");

row.innerHTML="";

round.options.forEach(src=>{

const option=document.createElement("div");

option.className="option";

option.dataset.image=src;

const img=document.createElement("img");

img.src=src;

img.className="optionImg";

option.appendChild(img);

row.appendChild(option);

});

attachDragEvents();

}


let activeOption=null;
let startX=0;
let startY=0;

/*************************************************
ATTACH DRAG EVENTS
**************************************************/

function attachDragEvents(){

document
.querySelectorAll(".option")
.forEach(option=>{

option.addEventListener(
"pointerdown",
startDrag
);

});

}

/*************************************************
START DRAG
**************************************************/

function startDrag(e){

e.preventDefault();

activeOption=e.currentTarget;

const rect=
activeOption.getBoundingClientRect();

dragClone=
activeOption.cloneNode(true);

dragClone.style.position="fixed";

dragClone.style.left=
rect.left+"px";

dragClone.style.top=
rect.top+"px";

dragClone.style.width=
rect.width+"px";

dragClone.style.height=
rect.height+"px";

dragClone.style.zIndex="9999";

dragClone.style.pointerEvents="none";

dragClone.style.transform="scale(1.08)";

document.body.appendChild(
dragClone
);

startX=e.clientX;
startY=e.clientY;

document.addEventListener(
"pointermove",
dragMove
);

document.addEventListener(
"pointerup",
endDrag
);

}

/*************************************************
MOVE DRAG
**************************************************/

function dragMove(e){

if(!dragClone) return;

dragClone.style.left=
(e.clientX-
dragClone.offsetWidth/2)
+"px";

dragClone.style.top=
(e.clientY-
dragClone.offsetHeight/2)
+"px";

}

/*************************************************
END DRAG
**************************************************/

function endDrag(e){

document.removeEventListener(
"pointermove",
dragMove
);

document.removeEventListener(
"pointerup",
endDrag
);

if(!dragClone) return;

const dropZone=
document.querySelector(
".dropZone"
);

const zoneRect=
dropZone.getBoundingClientRect();

const inside=

e.clientX>=zoneRect.left &&
e.clientX<=zoneRect.right &&
e.clientY>=zoneRect.top &&
e.clientY<=zoneRect.bottom;

if(inside){

checkAnswer(
activeOption.dataset.image,
dropZone
);

}

dragClone.remove();

dragClone=null;

activeOption=null;

}

/*************************************************
CHECK ANSWER
**************************************************/

function checkAnswer(
selectedImage,
dropZone
){

const correctAnswer=
dropZone.dataset.answer;

if(
selectedImage===
correctAnswer
){

handleCorrectAnswer(
selectedImage,
dropZone
);

}else{

handleWrongAnswer();

}

}

let gameLocked=false;

/*************************************************
CORRECT ANSWER
**************************************************/

function handleCorrectAnswer(selectedImage,dropZone){

if(gameLocked) return;

gameLocked=true;

/* snap image */

dropZone.innerHTML="";

const img=document.createElement("img");

img.src=selectedImage;

img.className="patternImg";

dropZone.appendChild(img);

/* message */

document.getElementById("message").innerHTML="⭐ Good Job!";

/* sound */

const correct=document.getElementById("correctSound");

correct.currentTime=0;
correct.play();

/* speech */

if("speechSynthesis" in window){

speechSynthesis.cancel();

const speech=
new SpeechSynthesisUtterance(
"Good Job!"
);

speech.rate=.95;
speech.pitch=1.15;
speech.volume=1;

speechSynthesis.speak(speech);

}

/* disable options */

document
.querySelectorAll(".option")
.forEach(option=>{

option.style.pointerEvents="none";

option.style.opacity=".5";

});

/* next round */

setTimeout(()=>{

currentRound++;

gameLocked=false;

if(currentRound>=rounds.length){

showFinishScreen();

}else{

loadRound();

}

},1000);

}

/*************************************************
WRONG ANSWER
**************************************************/

function handleWrongAnswer(){

const wrong=
document.getElementById("wrongSound");

wrong.currentTime=0;

wrong.play();

const msg=
document.getElementById("message");

msg.innerHTML="Try Again";

setTimeout(()=>{

msg.innerHTML="";

},700);

}

/*************************************************
SHOW FINISH
**************************************************/

function showFinishScreen(){

document.getElementById("game").style.display="none";

document.getElementById("finish").style.display="flex";

document.getElementById("finishSound").play();

showConfetti();

}

/*************************************************
PLAY AGAIN
**************************************************/
function showConfetti(){

for(let i=0;i<80;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=
`hsl(${Math.random()*360},80%,60%)`;

c.style.animation=
"fall "+(2+Math.random()*2)+"s linear";

document.body.appendChild(c);

setTimeout(()=>{

c.remove();

},4000);

}

}
document
.getElementById("playAgain")
.addEventListener("click",restartGame);

function restartGame(){

currentRound=0;
  
document.getElementById("message").innerHTML="";

gameLocked=false;

document.getElementById("finish").style.display="none";

document.getElementById("game").style.display="none";

document.getElementById("titleScreen").style.display="none";

document.getElementById("splash").style.display="flex";

setTimeout(()=>{

document.getElementById("splash").style.display="none";

document.getElementById("titleScreen").style.display="block";

},5000);

}    
</script>

</body>
</html>
